const EN = {"O": {"sol": {"n": "Sun", "desc": "The star of the Solar System: a huge sphere of very hot gas that makes light and heat. Its light takes about 8 minutes and 20 seconds to reach Earth.", "st": [["Type", "Yellow dwarf (G2V)"], ["Diameter", "1,392,700 km (109 Earths)"], ["Surface", "5,500 °C"], ["Core", "15 million °C"], ["Age", "4.6 billion years"], ["Mass", "99.86% of the Solar System"]], "fun": ["1.3 MILLION EARTHS WOULD FIT INSIDE", "If the Sun were a hollow box, it would take about 1.3 million planets like ours to fill it."]}, "mercurio": {"n": "Mercury", "desc": "The smallest planet and the closest to the Sun. It has almost no atmosphere to hold heat: it scorches by day and freezes by night.", "st": [["Diameter", "4,879 km"], ["Distance from the Sun", "58 million km (0.39 AU)"], ["Year", "88 days"], ["Day (sunrise to sunrise)", "176 Earth days"], ["Moons", "0"], ["Temperature", "−173 to 427 °C"], ["Gravity", "38% of Earth"]], "fun": ["A DAY LONGER THAN ITS YEAR", "From one sunrise to the next, 176 Earth days go by: twice as long as it takes to go around the Sun."]}, "venus": {"n": "Venus", "desc": "Almost the size of Earth, but covered in clouds of sulfuric acid. Its thick carbon dioxide atmosphere traps heat: it is the hottest planet.", "st": [["Diameter", "12,104 km"], ["Distance from the Sun", "108 million km (0.72 AU)"], ["Year", "225 days"], ["Day (sunrise to sunrise)", "117 Earth days"], ["Moons", "0"], ["Temperature", "464 °C"], ["Gravity", "91% of Earth"]], "fun": ["THE SUN RISES IN THE WEST", "Venus spins the opposite way from almost every other planet. If you could see the sky through its clouds, the Sun would rise in the west."]}, "tierra": {"n": "Earth", "desc": "Our home and the only place where we know life exists. About three quarters of its surface is covered by water.", "st": [["Diameter", "12,742 km"], ["Distance from the Sun", "150 million km (1 AU)"], ["Year", "365.25 days"], ["Day", "24 hours"], ["Moons", "1"], ["Average temperature", "15 °C"], ["Axial tilt", "23.4°"]], "fun": ["YOU ARE TRAVELING AT 107,000 KM/H", "Even if you can’t feel it, Earth moves along its orbit at about 30 km per second. While you read this, you have already traveled hundreds of kilometers."]}, "marte": {"n": "Mars", "desc": "The red planet. Its color comes from the iron oxide (rust) that covers the ground. It has ice caps at its poles and ancient river beds.", "st": [["Diameter", "6,779 km"], ["Distance from the Sun", "228 million km (1.52 AU)"], ["Year", "687 days"], ["Day", "24 h 37 min"], ["Moons", "2 (Phobos and Deimos)"], ["Average temperature", "−63 °C"], ["Gravity", "38% of Earth"]], "fun": ["A 22 KM VOLCANO", "Olympus Mons is the largest volcano in the Solar System: it is about 22 km tall, more than twice the height of Everest."]}, "jupiter": {"n": "Jupiter", "desc": "The giant of the Solar System: more than 1,300 Earths would fit inside it. It is a ball of hydrogen and helium with bands of clouds and enormous storms.", "st": [["Diameter", "139,820 km (11 Earths)"], ["Distance from the Sun", "778 million km (5.2 AU)"], ["Year", "11.9 years"], ["Day", "9 h 56 min"], ["Moons", "more than 90"], ["Temperature", "−110 °C (clouds)"], ["Gravity", "2.5 times Earth"]], "fun": ["A STORM BIGGER THAN EARTH", "The Great Red Spot is a giant hurricane that has been raging for more than 150 years. The whole Earth would fit inside it."]}, "saturno": {"n": "Saturn", "desc": "Famous for its rings, made of billions of chunks of ice and rock. It is the least dense planet: it would float in a giant bathtub.", "st": [["Diameter", "116,460 km"], ["Distance from the Sun", "1.43 billion km (9.5 AU)"], ["Year", "29.5 years"], ["Day", "10 h 34 min"], ["Moons", "more than 270 (record)"], ["Temperature", "−140 °C"], ["Gravity", "1.07 times Earth"]], "fun": ["VERY WIDE AND VERY THIN RINGS", "The main rings measure about 280,000 km from edge to edge, but in most places they are less than 1 km thick."]}, "urano": {"n": "Uranus", "desc": "An ice giant that spins lying on its side: its axis is tilted about 98°. The methane in its atmosphere gives it its blue-green color. William Herschel discovered it in 1781.", "st": [["Diameter", "50,724 km"], ["Distance from the Sun", "2.87 billion km (19.2 AU)"], ["Year", "84 years"], ["Day", "17 h 14 min"], ["Moons", "29"], ["Temperature", "−195 °C"], ["Gravity", "89% of Earth"]], "fun": ["42 YEARS OF DAY AND 42 OF NIGHT", "Because of its tilt, each pole of Uranus spends about 42 years in sunlight and then 42 years in darkness."]}, "neptuno": {"n": "Neptune", "desc": "The planet farthest from the Sun. It is cold, dark and deep blue, with the fastest winds in the Solar System: over 2,000 km/h.", "st": [["Diameter", "49,244 km"], ["Distance from the Sun", "4.5 billion km (30 AU)"], ["Year", "165 years"], ["Day", "16 h 6 min"], ["Moons", "16"], ["Temperature", "−200 °C"], ["Gravity", "1.14 times Earth"]], "fun": ["DISCOVERED WITH MATH", "Astronomers calculated where it had to be before anyone saw it. In 1846 they pointed a telescope at that spot, and there it was."]}, "luna": {"n": "Moon", "desc": "Earth’s only natural satellite and the only place beyond our planet where people have walked, between 1969 and 1972.", "st": [["Diameter", "3,474 km"], ["Distance from Earth", "384,400 km"], ["Orbit around Earth", "27.3 days"], ["Phase cycle", "29.5 days"], ["Temperature", "−173 to 127 °C"], ["Gravity", "17% of Earth"]], "fun": ["IT ALWAYS FACES US", "The Moon takes the same time to spin once as it does to go around Earth. That is why we always see the same side from here."]}, "io": {"n": "Io", "desc": "A moon of Jupiter. It is the place with the most active volcanoes in the Solar System: Jupiter’s gravity stretches it and heats it from inside.", "st": [["Diameter", "3,643 km"], ["Planet", "Jupiter"], ["Orbit", "1.8 days"], ["Active volcanoes", "more than 400"]], "fun": ["LAVA FOUNTAINS 400 KM HIGH", "Some of Io’s volcanoes throw material hundreds of kilometers high."]}, "europa": {"n": "Europa", "desc": "A moon of Jupiter covered by an icy crust. Underneath lies an ocean of salty water with more water than all of Earth’s oceans combined.", "st": [["Diameter", "3,122 km"], ["Planet", "Jupiter"], ["Orbit", "3.6 days"], ["Surface", "Cracked ice"]], "fun": ["A SPACECRAFT IS ON ITS WAY", "The Europa Clipper mission launched in 2024 to study whether its ocean could have conditions for life."]}, "ganimedes": {"n": "Ganymede", "desc": "The largest moon in the Solar System: it is bigger than the planet Mercury. It is the only moon with its own magnetic field.", "st": [["Diameter", "5,268 km"], ["Planet", "Jupiter"], ["Orbit", "7.2 days"], ["Record", "Largest moon"]], "fun": ["BIGGER THAN A PLANET", "If Ganymede orbited the Sun instead of Jupiter, we would call it a planet."]}, "calisto": {"n": "Callisto", "desc": "A moon of Jupiter with the most heavily cratered surface in the Solar System. It has barely changed in billions of years.", "st": [["Diameter", "4,821 km"], ["Planet", "Jupiter"], ["Orbit", "16.7 days"], ["Surface", "Ancient craters"]], "fun": ["A MUSEUM OF IMPACTS", "Every crater on Callisto is the mark of a rock that crashed into it a very long time ago."]}, "titan": {"n": "Titan", "desc": "Saturn’s largest moon and the only one with a thick atmosphere. It has rivers, lakes and rain, but of liquid methane instead of water.", "st": [["Diameter", "5,150 km"], ["Planet", "Saturn"], ["Orbit", "16 days"], ["Temperature", "−179 °C"]], "fun": ["A DRONE WILL FLY THERE", "NASA’s Dragonfly mission plans to send a drone that will fly through Titan’s skies."]}, "encelado": {"n": "Enceladus", "desc": "A small moon of Saturn, as white as snow. From its south pole it shoots jets of salty water into space from a hidden ocean.", "st": [["Diameter", "504 km"], ["Planet", "Saturn"], ["Orbit", "1.4 days"], ["Surface", "Very bright ice"]], "fun": ["SPACE GEYSERS", "The water Enceladus shoots out forms one of Saturn’s rings, the E ring."]}, "triton": {"n": "Triton", "desc": "Neptune’s largest moon. It orbits backwards compared with its planet, so it is thought to be a Kuiper belt object that Neptune captured.", "st": [["Diameter", "2,707 km"], ["Planet", "Neptune"], ["Orbit", "5.9 days"], ["Temperature", "−235 °C"]], "fun": ["NITROGEN GEYSERS", "In 1989 the Voyager 2 probe saw dark plumes rising from its frozen surface."]}, "ceres": {"n": "Ceres", "desc": "The largest object in the asteroid belt and the dwarf planet closest to the Sun. The Dawn probe visited it between 2015 and 2018.", "st": [["Diameter", "940 km"], ["Distance from the Sun", "2.8 AU"], ["Year", "4.6 years"], ["Day", "9 h"]], "fun": ["IT WAS A PLANET FIRST", "When it was discovered in 1801 it was called a planet, then an asteroid, and since 2006 it has been a dwarf planet."]}, "pluton": {"n": "Pluto", "desc": "An icy dwarf planet in the Kuiper belt. It was the ninth planet from its discovery in 1930 until 2006. It is smaller than our Moon.", "st": [["Diameter", "2,377 km"], ["Distance from the Sun", "39.5 AU (average)"], ["Year", "248 years"], ["Moons", "5 (the largest is Charon)"], ["Temperature", "−230 °C"], ["Discovered", "1930"]], "fun": ["A HEART OF ICE", "In 2015 the New Horizons probe photographed a huge heart-shaped plain of ice called Tombaugh Regio."]}, "cinturon": {"n": "Asteroid belt", "desc": "A zone between Mars and Jupiter with millions of rocks circling the Sun. They are leftovers from the formation of the Solar System.", "st": [["Location", "Between Mars and Jupiter"], ["Distance from the Sun", "2.2 to 3.2 AU"], ["Objects", "Millions"], ["Largest object", "Ceres"]], "fun": ["NOT LIKE IN THE MOVIES", "Asteroids are so far apart that spacecraft cross the belt without crashing. All together they weigh less than 3% of our Moon."]}, "kuiper": {"n": "Kuiper belt", "desc": "A huge icy region beyond Neptune, 30 to 50 AU from the Sun. It is home to Pluto, other dwarf planets and many comets.", "st": [["Location", "Beyond Neptune"], ["Distance from the Sun", "30 to 50 AU"], ["Residents", "Pluto, Eris, Makemake…"], ["Material", "Ice and rock"]], "fun": ["A COMET FACTORY", "Many comets that come back every few years come from this region."]}, "via-lactea": {"n": "Milky Way", "desc": "Our galaxy: a barred spiral with hundreds of billions of stars. The Sun sits in one of its arms, far from the center.", "st": [["Type", "Barred spiral"], ["Diameter", "~100,000 light years"], ["Stars", "100 to 400 billion"], ["Age", "~13.6 billion years"], ["One lap of the Sun", "~230 million years"]], "fun": ["A ROAD OF MILK", "On a night without lights you see it as a white band across the sky. The ancient Greeks imagined it as spilled milk."]}, "sgra": {"n": "Sagittarius A*", "desc": "The supermassive black hole at the center of the Milky Way. Its gravity is so strong that not even light can escape if it gets too close.", "st": [["Mass", "4 million suns"], ["Distance", "26,000 light years"], ["First image", "2022"], ["Where to look", "Constellation Sagittarius"]], "fun": ["A PHOTO OF THE INVISIBLE", "In 2022 the Event Horizon Telescope, which links radio telescopes around the world, showed the ring of light around it."]}, "proxima": {"n": "Proxima Centauri", "desc": "The closest star to the Sun. It is a small, cool red dwarf that you cannot see with the naked eye. It has at least one Earth-like planet.", "st": [["Distance", "4.24 light years"], ["Type", "Red dwarf"], ["Size", "15% of the Sun"], ["Planets", "At least 2"]], "fun": ["OUR NEIGHBOR IS VERY FAR AWAY!", "With the fastest spacecraft we have today, it would take thousands of years to get there."]}, "sirio": {"n": "Sirius", "desc": "The brightest star in the night sky, in the constellation Canis Major. It is actually two stars: a white star and a tiny white dwarf.", "st": [["Distance", "8.6 light years"], ["Type", "White star"], ["Brightness", "25 times the Sun"], ["Constellation", "Canis Major"]], "fun": ["THE DOG STAR", "Because it is in Canis Major, the Great Dog, it is called the Dog Star. The ancient Egyptians used it to predict the floods of the Nile."]}, "betelgeuse": {"n": "Betelgeuse", "desc": "A red supergiant on the shoulder of the constellation Orion. It is near the end of its life and one day it will explode as a supernova.", "st": [["Distance", "~550 light years"], ["Type", "Red supergiant"], ["Size", "~750 times the Sun"], ["Constellation", "Orion"]], "fun": ["IT WOULD REACH ALMOST TO JUPITER", "If it were in the Sun’s place, its surface would swallow Mercury, Venus, Earth and Mars."]}, "polaris": {"n": "North Star", "desc": "Polaris sits almost directly above Earth’s north pole, so it does not seem to move in the sky. For centuries it guided sailors.", "st": [["Distance", "~430 light years"], ["Type", "Yellow supergiant"], ["Constellation", "Ursa Minor"], ["Use", "Points north"]], "fun": ["IT IS NOT THE BRIGHTEST", "Many people think it is the brightest star, but it ranks around 48th."]}, "pleyades": {"n": "Pleiades", "desc": "A cluster of young blue stars that you can see with the naked eye in the constellation Taurus. In Mexico it is also called Las Siete Cabrillas.", "st": [["Distance", "~444 light years"], ["Stars", "more than 1,000"], ["Age", "~100 million years"], ["Constellation", "Taurus"]], "fun": ["NEW FIRE", "The Mexica watched the Pleiades to hold the New Fire ceremony every 52 years."]}, "orion-neb": {"n": "Orion Nebula", "desc": "A huge cloud of gas and dust where new stars are being born. You can see it with the naked eye as a smudge in Orion’s sword.", "st": [["Distance", "~1,344 light years"], ["Size", "~24 light years"], ["Type", "Star nursery"], ["Constellation", "Orion"]], "fun": ["A STAR NURSERY", "Inside it there are more than 700 stars forming, some with disks where planets could be born."]}, "cangrejo": {"n": "Crab Nebula", "desc": "The remains of a star that exploded as a supernova. Chinese astronomers recorded that explosion in the year 1054: it could be seen even in daytime.", "st": [["Distance", "~6,500 light years"], ["Explosion seen", "Year 1054"], ["At the center", "A pulsar"], ["Constellation", "Taurus"]], "fun": ["A LIGHTHOUSE SPINNING 30 TIMES A SECOND", "At its center remains a neutron star that spins very fast and sends out pulses of energy."]}, "nube-grande": {"n": "Large Magellanic Cloud", "desc": "A small galaxy that orbits the Milky Way. From the southern hemisphere it looks like a cloud to the naked eye.", "st": [["Distance", "~160,000 light years"], ["Type", "Satellite galaxy"], ["Diameter", "~14,000 light years"], ["Visible from", "Southern hemisphere"]], "fun": ["NAMED BY SAILORS", "Ferdinand Magellan’s crew described it on their voyage around the world (1519-1522)."]}, "nube-peq": {"n": "Small Magellanic Cloud", "desc": "Another neighboring dwarf galaxy, companion of the Large Cloud. Both are being tugged by the Milky Way’s gravity.", "st": [["Distance", "~200,000 light years"], ["Type", "Dwarf galaxy"], ["Diameter", "~7,000 light years"], ["Visible from", "Southern hemisphere"]], "fun": ["A BRIDGE OF GAS", "Between the two Clouds there is a long bridge of gas and stars called the Magellanic Bridge."]}, "andromeda": {"n": "Andromeda", "desc": "The nearest large galaxy. It is a spiral like ours but bigger. On a dark night you can see it with the naked eye as a little smudge.", "st": [["Distance", "2.5 million light years"], ["Diameter", "~220,000 light years"], ["Stars", "~1 trillion"], ["Approaching at", "110 km per second"]], "fun": ["WILL IT CRASH INTO US?", "It is approaching at 110 km per second. Calculations from 2025 suggest about a 50% chance that it will merge with the Milky Way within the next 10 billion years."]}, "triangulo": {"n": "Triangulum Galaxy", "desc": "The third largest galaxy in the Local Group, after Andromeda and the Milky Way. It is a spiral with lots of gas and new stars.", "st": [["Distance", "~2.7 million light years"], ["Diameter", "~60,000 light years"], ["Stars", "~40 billion"], ["Constellation", "Triangulum"]], "fun": ["AT THE LIMIT OF SIGHT", "It is one of the most distant objects a person can see without a telescope, only under very dark skies."]}, "grupo-local": {"n": "Local Group", "desc": "Our \"neighborhood\" of galaxies. It is made of more than 80 galaxies held together by gravity; the largest are Andromeda and the Milky Way.", "st": [["Galaxies", "more than 80"], ["Diameter", "~10 million light years"], ["Largest members", "Andromeda and the Milky Way"], ["Part of", "Laniakea Supercluster"]], "fun": ["A NEIGHBORHOOD INSIDE A CITY", "The Local Group is only a small part of a supercluster of galaxies called Laniakea, which means \"immense heaven\" in Hawaiian."]}, "universo": {"n": "Observable universe", "desc": "Everything we can ever see from Earth: the light that has had time to reach us since the Big Bang, 13.8 billion years ago.", "st": [["Age", "13.8 billion years"], ["Diameter", "~93 billion light years"], ["Galaxies", "hundreds of billions"], ["Origin", "Big Bang"]], "fun": ["LOOKING FAR IS LOOKING INTO THE PAST", "Light takes time to travel. When you see Andromeda, you see light that left it 2.5 million years ago."]}}, "ED": {"sol": {"capas": [["Core", "Nuclear fusion happens here: hydrogen turns into helium at 15 million °C."], ["Radiative zone", "Energy travels as light bouncing between particles; it can take more than 100,000 years to cross it."], ["Convective zone", "Hot gas rises and cooler gas sinks, like water boiling in a pot."]], "nota": "Above them are the photosphere, the \"surface\" we see (5,500 °C), and the corona, an atmosphere of more than a million degrees that can only be seen during total eclipses.", "mis": [["1995", "SOHO", "ESA/NASA", "Watches the Sun nonstop and has discovered thousands of comets."], ["2018", "Parker Solar Probe", "NASA", "The spacecraft that has come closest to the Sun: in 2024 it passed about 6 million km from its surface."], ["2020", "Solar Orbiter", "ESA/NASA", "Took the first images of the Sun’s poles."], ["2023", "Aditya-L1", "ISRO (India)", "India’s first space-based solar observatory."]], "obs": "Never look at it directly, not even with binoculars or a telescope: it damages your eyes forever. Use ISO 12312-2 certified glasses or project its image onto a sheet of paper. On April 8, 2024 a total eclipse was visible in Mazatlán, Durango and Torreón.", "voc": [["Nuclear fusion", "The joining of atomic nuclei, which releases a huge amount of energy."], ["Photosphere", "The visible layer of the Sun, where the light that reaches us comes from."], ["Sunspot", "A cooler, darker area of the surface caused by magnetism."]], "ideas": ["The Sun is a medium-sized star; it looks huge because it is close.", "It makes energy by joining hydrogen to form helium.", "Its gravity holds all the planets of the Solar System together."], "preg": ["What would happen on Earth if the Sun suddenly went out?", "Why does the Sun look bigger than other stars?", "Why is it dangerous to look at it directly, even for a moment?"], "act": "Sundial: push a stick into the ground in the schoolyard and mark its shadow every hour. How do its length and direction change?"}, "mercurio": {"capas": [["Iron core", "Huge for its size: it takes up more than half of the planet’s volume."], ["Mantle", "A layer of rock about 400 km thick."], ["Crust", "Rock full of craters, about 35 km thick."]], "mis": [["1974", "Mariner 10", "NASA", "The first spacecraft to visit it; it photographed less than half of its surface."], ["2011", "MESSENGER", "NASA", "The first to orbit it; it found ice inside polar craters that are always in shadow."], ["2018", "BepiColombo", "ESA/JAXA", "Two spacecraft traveling together that enter orbit in 2026."]], "obs": "You can see it with the naked eye very low on the horizon, shortly after sunset or shortly before sunrise. It never strays far from the Sun, which makes it the hardest planet to spot.", "voc": [["Orbit", "The path one body follows around another."], ["Crater", "A hole left by the impact of a space rock."], ["Atmosphere", "The layer of gases surrounding a planet."]], "ideas": ["It is the smallest and fastest planet: it goes around the Sun in 88 days.", "With no atmosphere, it goes from 427 °C by day to −173 °C at night.", "It has ice in polar craters where sunlight never reaches."], "preg": ["Why isn’t Mercury the hottest planet if it is the closest to the Sun?", "What is an atmosphere good for?", "What would a full day on Mercury be like?"], "act": "Craters in a tray: fill a tray with flour, cover it with cocoa powder and drop marbles from different heights. Compare the craters."}, "venus": {"capas": [["Iron and nickel core", "Similar to Earth’s."], ["Mantle", "Hot rock that fed thousands of volcanoes."], ["Crust", "Volcanic rock crushed by a very dense atmosphere."]], "mis": [["1970", "Venera 7", "USSR", "The first spacecraft to land on another planet and send back data."], ["1990", "Magellan", "NASA", "Used radar to map 98% of the surface beneath the clouds."], ["2015", "Akatsuki", "JAXA", "Studied Venus’s weather and winds."], ["2030s", "VERITAS, DAVINCI and EnVision", "NASA/ESA", "Planned missions to study its surface and atmosphere."]], "obs": "It is the brightest thing in the sky after the Sun and the Moon. It appears as the \"evening star\" toward the west after sunset or the \"morning star\" toward the east before sunrise. Through a telescope you can see its phases, like the Moon’s.", "voc": [["Greenhouse effect", "When an atmosphere traps the Sun’s heat."], ["Retrograde rotation", "Spinning in the opposite direction to most planets."], ["Radar", "Waves that bounce back and let us \"see\" through clouds."]], "ideas": ["It is almost the size of Earth, but its environment is hellish.", "Its CO₂ atmosphere causes an extreme greenhouse effect: 464 °C.", "The pressure on its ground is 92 times Earth’s, like being 900 m under the sea."], "preg": ["What does Venus teach us about global warming on Earth?", "Why did the spacecraft that landed there work for such a short time?", "How can we study ground that we cannot see?"], "act": "Greenhouse in a jar: put two thermometers in the sun, one inside a closed jar. Record the temperature every 5 minutes."}, "tierra": {"capas": [["Inner core", "A solid ball of iron and nickel, as hot as the surface of the Sun."], ["Outer core", "Liquid metal; its motion creates the magnetic field that protects us."], ["Mantle", "Very hot rock that moves slowly and drags the tectonic plates."], ["Crust", "The thin layer where we live: from 5 km under the oceans to 70 km under mountains."]], "nota": "In the model the crust looks thicker than it really is: in proportion, it is thinner than the skin of an apple.", "mis": [["1957", "Sputnik 1", "USSR", "The first artificial satellite in history."], ["1972", "Landsat", "NASA/USGS", "Has been photographing Earth from space for more than 50 years."], ["1990", "\"Pale Blue Dot\"", "NASA", "Voyager 1 photographed Earth from 6 billion km away."], ["2000", "International Space Station", "Several countries", "People have lived in space without interruption since 2000."]], "obs": "During a lunar eclipse you can see Earth’s shadow on the Moon: it is always curved, proof that our planet is round.", "voc": [["Rotation", "Earth spinning on its axis; it takes 24 hours and causes day and night."], ["Revolution", "Earth’s trip around the Sun; it takes 365.25 days."], ["Magnetic field", "An invisible shield that deflects particles coming from the Sun."]], "ideas": ["It is the only known planet with liquid water on its surface and with life.", "Rotation causes day and night; revolution and the tilt of the axis cause the seasons.", "Its atmosphere and magnetic field protect us from radiation."], "preg": ["What does a planet need to have life as we know it?", "Why is there a leap year every four years?", "If Earth were not tilted, would there be seasons?"], "act": "Day and night with a lamp: in a dark room, use a lamp as the Sun and a globe. Spin the globe and point out when it is daytime in Mexico and in Japan."}, "luna": {"capas": [["Core", "Small, made of iron, partly molten."], ["Mantle", "Dense rock; long ago it produced the lava that formed the dark \"seas\"."], ["Crust", "Light-colored rock full of craters; thicker on the far side."]], "mis": [["1959", "Luna 2", "USSR", "The first human-made object to reach the Moon."], ["1969", "Apollo 11", "NASA", "Neil Armstrong and Buzz Aldrin, the first people to walk on it."], ["2019", "Chang’e 4", "China", "The first landing on the far side."], ["2024", "Colmena", "UNAM (Mexico)", "The first Mexican mission to the Moon: tiny robots that flew aboard the Peregrine lander, which could not land."]], "obs": "You can see it almost every night and many afternoons. With binoculars you can make out craters and \"seas\". Relief is easiest to see near first quarter, along the line between light and shadow.", "voc": [["Natural satellite", "A body that orbits a planet without having been put there by people."], ["Lunar phase", "The lit shape of the Moon that we see from Earth."], ["Tide", "The rise and fall of the sea, caused mainly by the Moon’s gravity."]], "ideas": ["The Moon has no light of its own: it reflects sunlight.", "Its phases repeat every 29.5 days.", "Its gravity causes the tides in Earth’s oceans."], "preg": ["Why don’t the astronauts’ footprints disappear?", "Why do we always see the same side?", "How would Earth change if we had no Moon?"], "act": "Moon diary: for 30 days, draw the Moon and write down the time. At the end, put the drawings in order and name each phase."}, "marte": {"capas": [["Core", "Iron, nickel and sulfur, probably liquid."], ["Mantle", "Silicate rock that fed giant volcanoes."], ["Crust", "Rock and red iron oxide dust, 24 to 72 km thick."]], "mis": [["1965", "Mariner 4", "NASA", "The first close-up photos of Mars."], ["1976", "Viking 1", "NASA", "The first successful landing that sent back photos of the surface."], ["2012", "Curiosity", "NASA", "A rover that confirmed Mars once had lakes."], ["2021", "Perseverance and Ingenuity", "NASA", "Searches for signs of ancient life; Ingenuity was the first helicopter on another planet."], ["2021", "Zhurong", "China", "China’s first rover on Mars."]], "obs": "You can see it with the naked eye as an orange \"star\" that does not twinkle. It is brightest when it is on the opposite side from the Sun, about every 26 months.", "voc": [["Rover", "A robot vehicle that moves across the surface of another world."], ["Iron oxide", "Rust; it gives Mars its red color."], ["Polar cap", "A layer of ice at the poles."]], "ideas": ["It is red because of the iron oxide in its soil.", "Billions of years ago it had rivers and lakes.", "It has the biggest volcano (Olympus Mons) and a 4,000 km canyon (Valles Marineris)."], "preg": ["What would a person need to live on Mars?", "How do we know Mars once had water?", "Why do we send robots before people?"], "act": "Design a rover: in teams, draw a vehicle for Mars. What wheels, cameras and power source does it need? Explain why."}, "jupiter": {"capas": [["Diffuse core", "Rock and metal mixed with hydrogen; it has no clear edge."], ["Metallic hydrogen", "Under huge pressure, hydrogen behaves like a liquid metal and creates a giant magnetic field."], ["Hydrogen and helium", "Gas that becomes liquid as you go deeper; the colorful clouds are on top."]], "mis": [["1973", "Pioneer 10", "NASA", "The first spacecraft to cross the asteroid belt and visit Jupiter."], ["1979", "Voyager 1 and 2", "NASA", "Discovered Io’s volcanoes and Jupiter’s rings."], ["1995", "Galileo", "NASA", "The first to orbit it; it dropped a probe into its atmosphere."], ["2016", "Juno", "NASA", "Studies its interior and its poles."], ["2023", "JUICE", "ESA", "On its way to study the icy moons; it arrives in 2031."]], "obs": "You can see it with the naked eye as a very bright white dot. With steady binoculars you can see up to four little dots beside it: the moons Galileo discovered in 1610.", "voc": [["Gas giant", "A planet made mostly of hydrogen and helium, with no solid surface."], ["Anticyclone", "A storm that spins around an area of high pressure, like the Great Red Spot."], ["Galilean moons", "Io, Europa, Ganymede and Callisto."]], "ideas": ["It has more than twice the mass of all the other planets combined.", "It has no surface: if you went down, the gas would get denser and denser.", "Its gravity deflects comets and asteroids."], "preg": ["Why couldn’t a spacecraft land on Jupiter?", "What did Galileo discover when he saw its moons, and why was it so important?", "Could Jupiter have become a star? What was it missing?"], "act": "Galileo’s moons: if the sky is clear, look at Jupiter with binoculars three nights in a row and draw where its moons are."}, "saturno": {"capas": [["Core", "Rock and ice surrounded by hydrogen."], ["Metallic hydrogen", "Hydrogen under great pressure that conducts electricity."], ["Hydrogen and helium", "Gas and liquid; above them are yellowish ammonia clouds."]], "mis": [["1979", "Pioneer 11", "NASA", "The first spacecraft to visit Saturn."], ["1980", "Voyager 1 and 2", "NASA", "Showed that the rings are made of thousands of ringlets."], ["2004", "Cassini-Huygens", "NASA/ESA/ASI", "Orbited Saturn for 13 years; the Huygens probe landed on Titan in 2005."]], "obs": "To the naked eye it is a yellowish dot that does not twinkle. With a small telescope, from about 25x magnification, you can already see the rings.", "voc": [["Density", "How much mass fits in a given volume; Saturn is less dense than water."], ["Planetary ring", "A disk of ice and rock particles orbiting a planet."], ["Cassini Division", "The dark gap between rings A and B."]], "ideas": ["Its rings are chunks of ice, from dust grains to blocks the size of a house.", "It has more known moons than any other planet.", "It is so light for its size that it would float in water."], "preg": ["Why are Saturn’s rings so thin?", "How can such a big planet float?", "Will the rings last forever?"], "act": "Cardboard rings: make a Saturn with a ball and a cardboard disk. Tilt it to see how the rings change as seen from Earth."}, "urano": {"capas": [["Rocky core", "Small, made of rock and ice."], ["Mantle of ices", "Thick, hot water, ammonia and methane, not ice like in a freezer."], ["Atmosphere", "Hydrogen, helium and methane; methane absorbs red light and leaves the blue-green."]], "mis": [["1781", "Discovery", "William Herschel", "The first planet discovered with a telescope."], ["1986", "Voyager 2", "NASA", "The only spacecraft to visit it; it discovered 10 new moons."]], "obs": "Under very dark skies you can just see it with the naked eye as a faint little star, if you know where to look. Through a telescope it appears as a small greenish disk.", "voc": [["Ice giant", "A large planet made mostly of water, ammonia and methane."], ["Axial tilt", "How much a planet’s axis is tilted."], ["Methane", "The gas that gives Uranus its blue-green color."]], "ideas": ["It spins \"lying down\": its axis is tilted 98°.", "Its poles get 42 years of light and 42 of darkness.", "It has dark, thin rings."], "preg": ["What could have knocked Uranus over?", "What would the seasons be like on a planet lying on its side?", "Why have we hardly visited it?"], "act": "A planet on its side: with a ball and a lamp, show how a planet tilted 98° receives light at four points of its orbit."}, "neptuno": {"capas": [["Rocky core", "Rock and iron, about the size of Earth."], ["Mantle of ices", "Very hot, tightly packed water, ammonia and methane."], ["Atmosphere", "Hydrogen, helium and methane, with winds over 2,000 km/h."]], "mis": [["1846", "Discovery", "Le Verrier and Galle", "Predicted with math and found with a telescope."], ["1989", "Voyager 2", "NASA", "The only spacecraft to visit it; it saw the Great Dark Spot and Triton’s geysers."]], "obs": "It cannot be seen with the naked eye. You need a telescope and a sky map; it appears as a tiny bluish dot.", "voc": [["Perturbation", "A small change in an object’s orbit caused by another object’s gravity."], ["Supersonic wind", "Wind faster than the speed of sound."], ["Great Dark Spot", "A giant storm seen by Voyager 2."]], "ideas": ["It is the farthest planet: it gets 900 times less sunlight than Earth.", "It was discovered with calculations before anyone saw it.", "It has the fastest winds in the Solar System."], "preg": ["How did they know where Neptune was without seeing it?", "Where does it get the energy for such fast winds if it is so far from the Sun?", "How long would a radio message take to get there?"], "act": "Message to Neptune: light takes about 4 hours to get there. Write what you would ask a spacecraft there and work out when you would get the answer."}, "io": {"capas": [["Iron core", "Iron and sulfur."], ["Partly molten mantle", "Hot rock with lots of magma."], ["Crust", "Sulfur and hardened lava in many colors."]], "mis": [["1979", "Voyager 1", "NASA", "Discovered its active volcanoes, the first ever seen beyond Earth."], ["1995", "Galileo", "NASA", "Studied its volcanoes for 8 years."], ["2023", "Juno", "NASA", "Photographed it up close in 2023 and 2024."]], "obs": "With binoculars it looks like one of the little dots next to Jupiter.", "ideas": ["It is the most volcanic world in the Solar System.", "Jupiter and other moons stretch it and heat it inside, like a ball squeezed over and over.", "Its yellow and orange surface is made of sulfur."], "preg": ["Where does the heat for Io’s volcanoes come from if it is so far from the Sun?", "How are its volcanoes similar to and different from Mexico’s?"]}, "europa": {"capas": [["Metal core", "Iron and nickel."], ["Rocky mantle", "Rock."], ["Ocean", "Liquid salty water about 100 km deep."], ["Ice crust", "Ice with reddish cracks."]], "mis": [["1995", "Galileo", "NASA", "Found clues of an ocean under the ice."], ["2024", "Europa Clipper", "NASA", "On its way; it will arrive in 2030 to study whether its ocean could support life."]], "obs": "With binoculars it looks like one of the little dots next to Jupiter.", "ideas": ["Under its ice there is an ocean with more water than all of Earth’s oceans combined.", "It is one of the best places to search for life beyond Earth.", "The cracks on its surface show that the ice moves."], "preg": ["What does a place need for life to exist?", "How could a robot explore an ocean under kilometers of ice?"]}, "ganimedes": {"capas": [["Iron core", "Liquid; it creates a magnetic field."], ["Rocky mantle", "Rock."], ["Ice and ocean", "Layers of ice with a salty ocean between them."]], "mis": [["1995", "Galileo", "NASA", "Discovered its magnetic field."], ["2023", "JUICE", "ESA", "In 2034 it will become the first spacecraft to orbit a moon other than ours."]], "ideas": ["It is the largest moon in the Solar System, bigger than the planet Mercury.", "It has its own magnetic field and auroras.", "It probably hides an ocean under the ice."], "preg": ["If Ganymede is bigger than Mercury, why isn’t it a planet?", "What are auroras and where else can we see them?"]}, "calisto": {"capas": [["Rock and ice mix", "An interior barely separated into layers."], ["Possible ocean", "There could be liquid salty water."], ["Ice crust", "Dark ice full of craters."]], "mis": [["1995", "Galileo", "NASA", "Studied its craters and interior."], ["2023", "JUICE", "ESA", "Will fly by it several times starting in 2031."]], "ideas": ["Its surface is the most cratered in the Solar System.", "It has barely changed in 4 billion years.", "It is far from Jupiter’s radiation, a good site for a future base."], "preg": ["What does a surface with so many craters tell us about its age?", "Why would it be a good place for a space base?"]}, "titan": {"capas": [["Rocky core", "Hydrated rock."], ["Ice mantle", "High-pressure ice."], ["Ocean", "Water with ammonia under the crust."], ["Ice crust", "Ice with rivers and lakes of methane on top."]], "mis": [["2004", "Cassini", "NASA/ESA/ASI", "Discovered its lakes with radar."], ["2005", "Huygens", "ESA", "Landed on its surface: the most distant landing in history."], ["2028", "Dragonfly", "NASA", "A drone that will fly over Titan (planned launch)."]], "ideas": ["It is the only moon with a thick atmosphere.", "It has a cycle like the water cycle, but with methane.", "It is bigger than the planet Mercury."], "preg": ["How is Titan’s methane cycle like the water cycle?", "Why would a drone work well on Titan?"]}, "encelado": {"capas": [["Rocky core", "Porous rock."], ["Ocean", "Salty water that shoots out in jets."], ["Ice crust", "The whitest object in the Solar System."]], "mis": [["2005", "Cassini", "NASA/ESA/ASI", "Discovered the geysers and flew through them."]], "ideas": ["It shoots jets of salty water from its south pole.", "Its ocean contains salts and carbon-based molecules.", "It reflects almost all the light it receives."], "preg": ["How could Cassini \"taste\" Enceladus’s water without landing?", "Why does it have liquid water if it is so cold?"]}, "triton": {"capas": [["Rocky core", "Rock and metal."], ["Ice mantle", "Water ice; maybe with an ocean."], ["Crust", "Pinkish nitrogen ice."]], "mis": [["1989", "Voyager 2", "NASA", "The only visit; it saw its geysers."]], "ideas": ["It orbits Neptune in the opposite direction.", "It was probably captured from the Kuiper belt.", "It is one of the coldest places ever measured: −235 °C."], "preg": ["What clues suggest Triton was not born alongside Neptune?", "How can there be geysers in such a cold place?"]}, "ceres": {"capas": [["Rocky interior", "Rock mixed with water."], ["Mantle of mud and ice", "Perhaps with brine."], ["Crust", "Rock, ice and salts; it has bright salt spots."]], "mis": [["2015", "Dawn", "NASA", "The first spacecraft to orbit two different worlds: Vesta and Ceres."]], "ideas": ["It is the largest object in the asteroid belt.", "It is the only dwarf planet in the inner Solar System.", "Its bright spots are salt deposits."], "preg": ["What is the difference between an asteroid and a dwarf planet?", "Why didn’t the asteroid belt form a planet?"]}, "pluton": {"capas": [["Rocky core", "Rock."], ["Water ice mantle", "Perhaps with a hidden ocean."], ["Crust", "Ices of nitrogen, methane and carbon monoxide."]], "mis": [["1930", "Discovery", "Clyde Tombaugh", "Found it by comparing photos of the sky in Arizona."], ["2006", "Reclassification", "International Astronomical Union", "A planet was defined and Pluto became a dwarf planet."], ["2015", "New Horizons", "NASA", "The first spacecraft to visit it: it discovered ice mountains and the \"heart\"."]], "obs": "It can only be seen with large telescopes: it is very small and extremely far away.", "voc": [["Dwarf planet", "A round body that orbits the Sun but has not cleared its orbit of other objects."], ["Kuiper belt", "The icy region beyond Neptune."]], "ideas": ["It is smaller than our Moon.", "It stopped being a planet in 2006 because it shares its orbit with many objects.", "It has mountains of water ice and nitrogen glaciers."], "preg": ["Do you agree that Pluto is no longer a planet? Why?", "What are the three requirements to be a planet?", "Why did New Horizons take 9 years to get there?"], "act": "Team debate: some argue that Pluto is a planet and others that it is a dwarf planet, using the 2006 criteria."}, "cinturon": {"mis": [["2007", "Dawn", "NASA", "Visited Vesta and Ceres."], ["2021", "Lucy", "NASA", "Visits asteroids; in 2023 it found that the asteroid Dinkinesh has a tiny moon."]], "ideas": ["It lies between Mars and Jupiter.", "Jupiter’s gravity kept its rocks from forming a planet.", "The asteroids are very far apart from each other."], "preg": ["Why can spacecraft cross it without crashing?", "What can asteroids teach us about the origin of the Solar System?"]}, "kuiper": {"mis": [["2019", "New Horizons", "NASA", "Flew past Arrokoth, the most distant object ever visited by a spacecraft."]], "ideas": ["It is an icy region beyond Neptune.", "Pluto, Eris, Makemake and Haumea live there.", "It holds almost untouched leftovers from the formation of the Solar System."], "preg": ["Why is it called the \"freezer\" of the Solar System?", "Where do comets come from?"]}, "via-lactea": {"mis": [["1610", "Galileo Galilei", "Italy", "With his telescope he saw that the white band is made of countless stars."], ["1989", "Hipparcos", "ESA", "Measured the positions of more than 100,000 stars."], ["2013", "Gaia", "ESA", "Made the most precise map of the galaxy: almost 2 billion stars."]], "obs": "On moonless nights far from cities it looks like a white band. In Mexico the best season is June to September, looking toward Sagittarius and Scorpius.", "voc": [["Galaxy", "A huge collection of stars, gas and dust held together by gravity."], ["Light year", "The distance light travels in one year: about 9.5 trillion km."], ["Spiral arm", "A curved part of the galaxy with many young stars."]], "ideas": ["It is a barred spiral galaxy about 100,000 light years across.", "The Sun is in the Orion Arm, 26,000 light years from the center.", "We see it edge-on, so it looks like a band across the sky."], "preg": ["If we are inside the galaxy, how do we know its shape?", "Why can’t we see the Milky Way from cities anymore?", "How many laps around the galaxy has the Sun made since it was born? (About 20.)"], "act": "Light pollution: count how many stars you see through a paper tube from home and compare with classmates who live in darker areas."}, "sgra": {"mis": [["2002", "Star orbits", "Genzel and Ghez", "Tracked stars orbiting it; they won the 2020 Nobel Prize in Physics."], ["2022", "Event Horizon Telescope", "Worldwide collaboration", "The first image of its shadow. The Large Millimeter Telescope Alfonso Serrano in Puebla, Mexico, took part."]], "obs": "It cannot be seen: the galaxy’s dust blocks it. But you can point to where it is: in the constellation Sagittarius, visible on summer nights.", "voc": [["Black hole", "A region where gravity is so strong that not even light escapes."], ["Event horizon", "The boundary beyond which nothing can get out."], ["Accretion disk", "Very hot gas swirling around a black hole."]], "ideas": ["It has the mass of 4 million suns in a space smaller than Mercury’s orbit.", "What we see in the image is the glowing gas around it.", "Mexico took part in the first photo with a telescope in Puebla."], "preg": ["If light cannot escape a black hole, how could they photograph it?", "Could the Sun become a black hole? (No: it does not have enough mass.)"], "act": "The gravity funnel: stretch a piece of cloth, put a heavy ball in the middle and roll marbles. Watch how they circle and fall in."}, "proxima": {"capas": [["Core", "Fuses hydrogen very slowly."], ["Convective zone", "The whole star mixes like a boiling pot."]], "mis": [["1915", "Discovery", "Robert Innes", "Found it from South Africa."], ["2016", "Proxima b", "ESO", "Discovery of a planet in its habitable zone."]], "obs": "It cannot be seen with the naked eye. Its neighbor Alpha Centauri is bright, but from Mexico it only appears very low on the southern horizon, and only from the south of the country.", "ideas": ["It is the closest star to the Sun: 4.24 light years.", "It is a red dwarf: smaller, cooler and longer-lived than the Sun.", "It has a planet in a zone where there could be liquid water."], "preg": ["How long would the fastest spacecraft we have take to get there?", "Why do red dwarfs live much longer than the Sun?"]}, "sirio": {"mis": [["1862", "Sirius B", "Alvan Clark", "First saw its companion, a white dwarf."]], "obs": "It is easy to find on winter nights: follow the line of Orion’s Belt downward and you will reach the brightest star in the sky.", "ideas": ["It is the brightest star in the night sky.", "It is a double system: a white star and a white dwarf.", "It is very close: 8.6 light years away."], "preg": ["Why does Sirius look brighter than bigger stars like Betelgeuse?", "What is a white dwarf?"]}, "betelgeuse": {"capas": [["Core", "Tiny compared with the star; it already fuses helium."], ["Convective envelope", "Bubbles of gas as big as Earth’s orbit."]], "mis": [["2019", "The Great Dimming", "Telescopes around the world", "It lost two thirds of its brightness because of a dust cloud it ejected."]], "obs": "In winter it is the orange star on Orion’s shoulder, up and to the left of Orion’s Belt.", "ideas": ["It is a red supergiant at the end of its life.", "It will explode as a supernova sometime in the next 100,000 years.", "The explosion will be visible even in daytime, but it will not be dangerous for Earth."], "preg": ["Why do big stars live shorter lives than small ones?", "What will be left after Betelgeuse explodes?"]}, "polaris": {"mis": [["1989", "Hipparcos", "ESA", "Measured its distance precisely."]], "obs": "Find the Big Dipper, draw a line through the two stars at the edge of its bowl and you will reach it. In Mexico its height above the horizon equals your latitude: about 19° in Mexico City.", "ideas": ["It points almost exactly north.", "It does not move in the sky because it sits above Earth’s axis.", "In thousands of years another star will become the \"pole star\"."], "preg": ["How could you find your way at night without a compass?", "Why is the North Star no use in the southern hemisphere?"]}, "pleyades": {"mis": [["1767", "John Michell", "England", "Showed with probability that the stars of a cluster really are together."]], "obs": "From November to March, after dark, look for a tight little group of bluish stars. With binoculars you can see dozens.", "ideas": ["It is a cluster of young stars born from the same cloud.", "In Japanese they are called Subaru, like the car brand.", "The Mexica used them for the New Fire ceremony."], "preg": ["How many stars can you see with the naked eye? And with binoculars?", "Why do young, hot stars look blue?"]}, "orion-neb": {"mis": [["1610", "First description", "Nicolas-Claude Fabri de Peiresc", "Described it through a telescope."], ["1995", "Hubble", "NASA/ESA", "Discovered dust disks around young stars."], ["2022", "James Webb", "NASA/ESA/CSA", "Saw stars and planets forming inside the dust."]], "obs": "In winter, below Orion’s Belt there is a \"sword\" of three stars; the middle one is a fuzzy patch: the nebula.", "voc": [["Nebula", "A cloud of gas and dust in space."], ["Protostar", "A star that is still forming."]], "ideas": ["It is a star nursery.", "Its pink glow comes from hydrogen lit up by young stars.", "It is the closest large star-forming region."], "preg": ["What is a star made of before it is born?", "Was our Sun born in a cloud like this one?"]}, "cangrejo": {"mis": [["1054", "Record of the supernova", "Chinese astronomers", "They saw it shine in daylight for 23 days."], ["1968", "Crab Pulsar", "Radio astronomers", "Found the neutron star at its center."], ["2023", "James Webb", "NASA/ESA/CSA", "Showed its filaments in great detail."]], "ideas": ["It is what is left of a star that exploded.", "At its center a pulsar spins 30 times a second.", "The elements that supernovae throw out form new planets… and us too."], "preg": ["What does it mean that \"we are made of stardust\"?", "Why can a supernova be seen in daytime?"]}, "nube-grande": {"mis": [["1987", "Supernova 1987A", "Southern hemisphere observatories", "The closest supernova seen in almost 400 years."]], "obs": "It cannot be seen from Mexico: it is too far south in the sky. It is easy to see from Chile, Argentina or Australia.", "ideas": ["It is a satellite galaxy of the Milky Way.", "Supernova 1987A happened there.", "It contains the Tarantula Nebula, a huge star nursery."], "preg": ["Why can some parts of the sky only be seen from the southern hemisphere?"]}, "nube-peq": {"mis": [["1912", "Henrietta Leavitt", "USA", "Studying stars in this cloud, she discovered a way to measure distances in the universe."]], "obs": "It cannot be seen from Mexico: it is too far south in the sky.", "ideas": ["It is an irregular dwarf galaxy.", "It is linked to the Large Cloud by a bridge of gas.", "The Milky Way’s gravity is distorting it."], "preg": ["Why do small galaxies often have irregular shapes?"]}, "andromeda": {"mis": [["964", "Al-Sufi", "Persia", "Described it as a \"small cloud\"."], ["1923", "Edwin Hubble", "USA", "Showed that it is another galaxy, very far from ours."], ["2025", "Hubble mosaic", "NASA/ESA", "The largest image of Andromeda, with about 200 million stars."]], "obs": "In autumn, under dark skies, you can see it with the naked eye as a small oval smudge in the constellation Andromeda. It is easier with binoculars.", "voc": [["Spiral galaxy", "A disk-shaped galaxy with curved arms."], ["Galaxy merger", "Two galaxies slowly joining because of their gravity."]], "ideas": ["It is the most distant thing you can see with the naked eye.", "It is bigger than the Milky Way.", "It is approaching us and could merge with the Milky Way in billions of years."], "preg": ["Will stars crash into each other when the galaxies meet? (Almost never: there is a lot of space between them.)", "How is it possible to see something 2.5 million light years away?"]}, "triangulo": {"mis": [["2019", "Hubble mosaic", "NASA/ESA", "Captured about 25 million stars."]], "obs": "Only under very dark skies and with good eyesight; with binoculars it looks like a very faint smudge.", "ideas": ["It is the third largest galaxy in the Local Group.", "It forms many new stars.", "It may orbit Andromeda."], "preg": ["What do you need to see very faint objects in the sky?"]}, "grupo-local": {"mis": [["1936", "Edwin Hubble", "USA", "Gave it the name \"Local Group\"."]], "ideas": ["It is our neighborhood of more than 80 galaxies.", "Most of them are dwarf galaxies.", "It belongs to a supercluster called Laniakea."], "preg": ["How would you write your complete \"cosmic address\"?"], "act": "Cosmic address: each student writes their full address: street, city, state, country, planet, system, galaxy, group and supercluster."}, "universo": {"mis": [["1965", "Cosmic microwave background", "Penzias and Wilson", "Detected the \"echo\" of the Big Bang."], ["1995", "Hubble Deep Field", "NASA/ESA", "An \"empty\" patch of sky turned out to hold thousands of galaxies."], ["2009", "Planck", "ESA", "A detailed map of the oldest light in the universe."], ["2021", "James Webb", "NASA/ESA/CSA", "Sees galaxies that formed shortly after the Big Bang."]], "voc": [["Big Bang", "The theory that the universe began very hot and dense and has been expanding ever since."], ["Expansion", "Distant galaxies are moving away from each other."], ["Cosmic web", "A network of galaxy filaments with enormous voids between them."]], "ideas": ["It is about 13.8 billion years old.", "It is expanding: distant galaxies move farther and farther apart.", "Galaxies form a great web of filaments and voids."], "preg": ["If looking far away means looking into the past, what would we see at the edge of the observable universe?", "What does it mean that the universe is expanding?"], "act": "Expanding balloon: draw dots (galaxies) on a balloon and blow it up. Measure how the dots move apart."}}, "CAPA": {"sol": [["From the center to 175,000 km", "Radius of ~175,000 km (a quarter of the Sun)", "15 million °C", "Very dense plasma", "Hydrogen and helium", "Every second it turns about 600 million tons of hydrogen into helium. That is the energy that gives us light and heat."], ["175,000 to 490,000 km from the center", "~315,000 km", "7 to 2 million °C", "Plasma", "Hydrogen and helium", "Light bounces around so many times that it can take more than 100,000 years to cross this layer. After that it takes only 8 minutes to reach Earth."], ["490,000 to 696,000 km from the center", "~200,000 km", "2 million to 5,500 °C", "\"Boiling\" plasma", "Hydrogen and helium", "The rising bubbles form the granulation of the surface: each granule is about 1,000 km across."]], "mercurio": [["400 to 2,440 km deep", "Radius of ~2,000 km", "~2,000 °C (estimated)", "Partly solid and partly liquid", "Iron", "It takes up more than half of the planet’s volume: like a peach with a huge pit."], ["35 to 400 km deep", "~400 km", "Hundreds of °C", "Solid", "Silicate rocks", "It is thin compared with Earth’s because the core takes up almost all the space."], ["0 to 35 km deep", "~35 km", "−173 to 427 °C at the surface", "Solid", "Rock full of craters", "It has cliffs hundreds of kilometers long that formed when the planet shrank as it cooled."]], "venus": [["From ~3,000 km deep to the center", "Radius of ~3,000 km", "Thousands of °C", "Probably liquid", "Iron and nickel", "Unlike Earth, Venus has almost no magnetic field, maybe because it spins so slowly."], ["30 to ~3,000 km deep", "~2,900 km", "Very hot", "Solid that slowly deforms", "Silicate rocks", "It fed thousands of volcanoes; some could still be active today."], ["0 to 30 km deep", "~30 km", "464 °C at the surface", "Solid", "Basalt (volcanic rock)", "The pressure here is 92 times Earth’s: like being 900 m under the sea."]], "tierra": [["5,150 to 6,371 km deep", "Radius of 1,220 km", "~5,400 °C", "Solid, because of the enormous pressure", "Iron and nickel", "It is as hot as the surface of the Sun and almost the size of the Moon."], ["2,900 to 5,150 km deep", "~2,250 km", "4,000 to 5,400 °C", "Liquid", "Molten iron and nickel", "Its currents of metal work like a dynamo: they create the magnetic field that moves compasses and protects us from the solar wind."], ["30 to 2,900 km deep", "~2,900 km (84% of the volume)", "500 to 4,000 °C", "Solid, but it flows very slowly, like modeling clay", "Rocks rich in iron and magnesium", "It moves a few centimeters a year, about as fast as your nails grow, and drags the tectonic plates. Mexico sits on five plates: that is why it has so many earthquakes."], ["0 to 70 km deep", "5–10 km under the sea; 30–70 km under continents", "From air temperature to ~900  liquid as you go down", "Hydrogen and helium with ammonia clouds", "It has no ground: a spacecraft going down would be crushed before touching anything solid."]], "saturno": [["Center of the planet", "Up to ~20% of the radius", "~12,000 °C (estimated)", "A dense mixture", "Rock and ice", "Waves in its rings helped scientists discover that its core is also diffuse."], ["From ~30,000 km deep", "Tens of thousands of km", "Thousands of °C", "Liquid", "Metallic hydrogen", "It generates Saturn’s magnetic field."], ["The first ~30,000 km", "~30,000 km", "−140 °C in the clouds", "Gas and liquid", "Hydrogen and helium with ammonia clouds", "At its north pole there is a hexagon-shaped storm wider than two Earths."]], "urano": [["Center of the planet", "About the size of Earth", "~5,000 °C (estimated)", "Solid", "Rock and iron", "It is small compared with the planet."], ["Below the atmosphere", "Thousands of km", "Thousands of °C", "A thick, hot liquid", "Water, ammonia and methane", "Some scientists think it could \"rain diamonds\" there because of the huge pressure."], ["Outer layer", "~5,000 km", "−195 °C", "Gas", "Hydrogen, helium and methane", "Methane absorbs red light: that is why Uranus looks blue-green."]], "neptuno": [["Center of the planet", "About the size of Earth", "~5,000 °C (estimated)", "Solid", "Rock and iron", "Neptune gives off more than twice the energy it gets from the Sun: it has heat stored inside."], ["Below the atmosphere", "Thousands of km", "Thousands of °C", "A thick, hot liquid", "Water, ammonia and methane", "As on Uranus, there could be \"diamond rain\"."], ["Outer layer", "~5,000 km", "−200 °C", "Gas", "Hydrogen, helium and methane", "Its winds exceed 2,000 km/h, the fastest in the Solar System."]], "pluton": [["Center", "Radius of ~850 km", "Unknown", "Solid", "Rock", "It is almost three quarters of Pluto’s radius."], ["Below the crust", "Hundreds of km", "Close to 0 °C if there is an ocean", "Ice and maybe liquid water", "Water ice", "New Horizons found clues of an ocean hidden under the \"heart\"."], ["Surface", "A few km", "−230 °C", "Solid", "Ices of nitrogen, methane and carbon monoxide", "It has water-ice mountains as tall as the Rockies."]]}, "STRUCT": {"galaxia": [["Bulge", "A thick center with old stars and, almost always, a giant black hole."], ["Disk and arms", "Where gas and dust are, and new stars are born (the pink spots)."], ["Halo", "A huge, faint sphere with clusters of ancient stars and dark matter."]], "nebulosa": [["Gas", "Mostly hydrogen; it glows when it receives energy from nearby stars."], ["Dust", "Tiny grains that block light and form dark areas."], ["Stars", "Those being born inside or, in a supernova, the one that died at the center."]], "agujero": [["Event horizon", "The boundary from which nothing, not even light, can get out."], ["Accretion disk", "Gas spinning very fast and heated to millions of degrees."], ["Ring of light", "Gravity bends light and forms a bright ring around the shadow."]], "cumulo": [["Sister stars", "They were born together from the same cloud, about 100 million years ago."], ["Nebulosity", "Dust that reflects the stars’ blue light."]], "region": [["Small bodies", "Rocks or ices that never formed a planet."], ["Orbits", "They all circle the Sun, each at its own pace."]], "universo": [["Galaxies", "Hundreds of billions, grouped in clusters."], ["Filaments", "Strings of galaxies forming a giant web."], ["Voids", "Enormous regions with very few galaxies."]]}, "CUR": {"sistema": "Elementary: the Solar System, the motions of Earth and the Moon, day and night. Middle school: gravitation, models of the Solar System, light and heat.", "cosmos": "Upper elementary: stars and the universe. Middle school: the universe, light and astronomical distances, the life of stars."}, "QUIZ": [["Which is the biggest planet?", ["Jupiter", "Saturn", "Neptune", "Earth"], "More than 1,300 Earths would fit inside Jupiter."], ["Which planet is the hottest?", ["Venus", "Mercury", "Mars", "Jupiter"], "Its CO₂ atmosphere traps heat: 464 °C."], ["Which planet is closest to the Sun?", ["Mercury", "Venus", "Earth", "Mars"], "It is only 0.39 AU from the Sun."], ["Which planet has the most known moons?", ["Saturn", "Jupiter", "Uranus", "Mars"], "Saturn has more than 270 confirmed moons."], ["How long does sunlight take to reach Earth?", ["About 8 minutes", "One second", "One day", "One year"], "It travels 150 million km in 8 minutes and 20 seconds."], ["Which planet spins \"lying down\"?", ["Uranus", "Neptune", "Venus", "Mars"], "Its axis is tilted about 98°."], ["What is our galaxy called?", ["Milky Way", "Andromeda", "Triangulum", "Magellanic Cloud"], "It is a barred spiral about 100,000 light years across."], ["What is at the center of the Milky Way?", ["A giant black hole", "The Sun", "A nebula", "A huge planet"], "It is called Sagittarius A* and has 4 million times the mass of the Sun."], ["Which is the closest star to the Sun?", ["Proxima Centauri", "Sirius", "Betelgeuse", "North Star"], "It is 4.24 light years away."], ["Why does Mars look red?", ["Because of iron oxide", "Because of lava", "Because it is very hot", "Because it reflects Jupiter"], "Its ground is covered with rusty dust."], ["Where is the asteroid belt?", ["Between Mars and Jupiter", "Between Earth and Mars", "Beyond Neptune", "Right next to the Sun"], "Between 2.2 and 3.2 AU from the Sun."], ["What is Pluto today?", ["A dwarf planet", "A planet", "A moon", "A comet"], "That is how the International Astronomical Union classified it in 2006."], ["What does a light year measure?", ["A distance", "A time", "A speed", "A brightness"], "It is the distance light travels in one year: 9.5 trillion km."], ["Which is the nearest large galaxy?", ["Andromeda", "Sombrero", "Whirlpool", "Triangulum"], "It is 2.5 million light years away."], ["Which is the largest moon in the Solar System?", ["Ganymede", "The Moon", "Titan", "Io"], "Ganymede, a moon of Jupiter, is bigger than Mercury."], ["Which moon has lakes of methane?", ["Titan", "Europa", "Phobos", "The Moon"], "Titan has methane rain, rivers and lakes."], ["In what year did people first walk on the Moon?", ["1969", "1957", "1985", "2001"], "It was the Apollo 11 mission."], ["What type of star is the Sun?", ["Yellow dwarf", "Red giant", "White dwarf", "Blue supergiant"], "It is a medium-sized G2V star."], ["How many planets are in the Solar System?", ["8", "9", "7", "10"], "There have been eight since 2006; Pluto is a dwarf planet."], ["Which planet has the Great Red Spot?", ["Jupiter", "Mars", "Saturn", "Neptune"], "It is a storm bigger than Earth."], ["Which planet has the fastest winds?", ["Neptune", "Jupiter", "Earth", "Venus"], "They exceed 2,000 km/h."], ["How many days is a year on Mars?", ["687", "365", "88", "225"], "Almost twice as long as an Earth year."], ["What causes the seasons?", ["The tilt of Earth’s axis", "The distance from the Sun", "The Moon", "The clouds"], "The axis tilted 23.4° changes how sunlight arrives."], ["How old is the universe?", ["13.8 billion years", "4.6 billion years", "6,000 years", "One million years"], "4.6 billion years is the age of the Solar System."]], "VF": [["The Sun is a star.", "It is a yellow dwarf star, like many you see at night."], ["The Moon makes its own light.", "The Moon reflects sunlight."], ["On Venus the Sun rises in the west.", "Venus spins backwards compared with almost all planets."], ["Jupiter is a rocky planet.", "It is a gas giant made of hydrogen and helium."], ["Saturn is the only planet with rings.", "Jupiter, Uranus and Neptune also have rings, but fainter ones."], ["There are seasons because Earth moves closer to and farther from the Sun.", "They are caused by the tilt of Earth’s axis."], ["Pluto is smaller than our Moon.", "Pluto measures 2,377 km and the Moon 3,474 km."], ["The light we see from Andromeda left it about 2.5 million years ago.", "Looking far away is looking into the past."], ["Mercury is the hottest planet.", "The hottest is Venus."], ["Mars has two moons.", "They are called Phobos and Deimos."], ["You can hear explosions in space.", "Sound needs air or another material to travel, and space has almost none."], ["The Milky Way is a spiral galaxy.", "It is a barred spiral."], ["Neptune was discovered thanks to mathematical calculations.", "Its position was predicted before anyone saw it, in 1846."], ["A day on Mercury lasts longer than its year.", "From sunrise to sunrise takes 176 days; its year lasts 88."], ["Betelgeuse is smaller than the Sun.", "It is a supergiant about 750 times wider than the Sun."], ["Earth is the largest of the rocky planets.", "It is slightly bigger than Venus."]], "WHO": {"mercurio": ["I have no moons.", "My day is longer than my year.", "I am the planet closest to the Sun."], "venus": ["I spin the opposite way from almost everyone.", "My clouds are made of sulfuric acid.", "I am the hottest planet."], "tierra": ["I have just one moon.", "My axis is tilted 23.4°.", "I am the only world with known life."], "marte": ["I have two small moons.", "I have the tallest volcano: Olympus Mons.", "They call me the red planet."], "jupiter": ["My day lasts less than 10 hours.", "I have a storm bigger than Earth.", "I am the biggest planet."], "saturno": ["I would float in a giant bathtub.", "I have more than 270 moons.", "My rings are the most famous."], "urano": ["William Herschel discovered me in 1781.", "Methane paints me blue-green.", "I spin lying on my side."], "neptuno": ["I was calculated before I was seen.", "My winds exceed 2,000 km/h.", "I am the planet farthest from the Sun."], "luna": ["I always show the same face.", "People first walked on me in 1969.", "I am Earth’s natural satellite."], "pluton": ["I have a heart of ice.", "I was a planet until 2006.", "Today I am a dwarf planet."], "sol": ["My light takes 8 minutes to reach you.", "I hold 99.86% of the Solar System’s mass.", "I am the star of the Solar System."], "andromeda": ["I am 2.5 million light years away.", "I am approaching the Milky Way at 110 km per second.", "I am the nearest large galaxy."], "sgra": ["Nobody sees me directly.", "I have the mass of 4 million suns.", "I am the black hole at the center of the galaxy."], "titan": ["It rains methane on me.", "I am the only moon with a thick atmosphere.", "I am Saturn’s largest moon."]}, "BADGES": [["First discovery", "Open your first card"], ["Rocky worlds", "See Mercury, Venus, Earth and Mars"], ["Giants club", "See the four giant planets"], ["Moon hunter", "Discover 5 moons"], ["Galactic traveler", "Discover 5 Milky Way objects"], ["Beyond", "Reach Andromeda"], ["Stellar mind", "7 out of 8 in the Cosmic quiz"], ["Navigator", "Order the planets with no mistakes"], ["Cosmic detective", "12 points or more in Who am I?"], ["Myth buster", "7 out of 8 in True or false"], ["Cosmos student", "Finish 3 lessons"], ["Collector", "Complete the whole album"]], "VIEWS": {"solar": ["Solar System", "<b>Solar System.</b> Sizes and distances are not to scale, so that everything fits on screen. See the lab «Real sizes and distances»."], "galaxy": ["Milky Way", "<b>Milky Way.</b> The yellow circle marks the Sun’s orbit, 26,000 light years from the center. Stars near the Sun are spread out more than in reality so you can see them."], "local": ["Local Group", "<b>Local Group.</b> Each galaxy is a swirl of billions of stars. Light takes 2.5 million years to get from here to Andromeda."]}, "KINDS": {"estrella": "Star", "rocoso": "Rocky planet", "gaseoso": "Gas giant", "helado": "Ice giant", "luna": "Moon", "enano": "Dwarf planet", "region": "Region", "galaxia": "Galaxy", "nebulosa": "Nebula", "agujero": "Black hole", "cumulo": "Star cluster", "universo": "Everything there is"}};

    i.onload = () => { TEX[k] = i; res(); tick(); }; i.onerror = () => { res(); tick(); }; i.src = 'tex/' + IMG_FILES[k]; })));
  function tick() { done++; const b = $('#ld-bar'); if (b) b.style.width = Math.round(done / keys.length * 100) + '%'; }
}
xrCheck();
$('#lang-btn').onclick = () => setLang(LANG === 'es' ? 'en' : 'es');
root.lang = LANG; applyLangData(); langBtn(); if (LANG === 'en') txTree(document.body);
showHome(); renderChip();
buildTextures();
loadImages().then(() => {
  SC.solar = buildSolar(); SC.galaxy = buildGalaxy(); SC.local = buildLocal();
  if (reduced) { speed = 1; playing = false; }
  playIcon(); resize(); buildLabels(); setScene('solar');
  Object.keys(THUMB).forEach(k => delete THUMB[k]); Object.keys(COVERS).forEach(k => delete COVERS[k]); showHome();
  $('#loading').hidden = true;
  requestAnimationFrame(t => { last = t; frame(t); });
});
})();
