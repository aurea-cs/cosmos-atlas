<title>Atlas Cosmos EpicGroup Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plataforma jugable del Sistema Solar, la Vía Láctea y el universo para Primaria y Secundaria: fichas interactivas, lecciones, retos y álbum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Atlas Cosmos EpicGroup Lab — gemelo del Atlas Geo.
   Escena 3D a pantalla completa; barra inferior con pestañas; vistas (Sistema Solar / Vía Láctea / Grupo Local) encima;
   paneles como hojas. Paleta de la marca (violeta nocturno) + un color fijo por tipo de objeto. */
:root {
  --night: #0d0630;
  --space: #04020f;
  --brand: #6d28d9;
  --brand-2: #8b5cf6;
  --pink: #ec4899; --hot: #ff3d7f; --cyan: #22d3ee; --gold: #fbbf24; --lime: #84cc16;
  --grad: linear-gradient(120deg, #7c3aed 0%, #db2777 55%, #f97316 100%);
  --grad-cool: linear-gradient(120deg, #6d28d9 0%, #2563eb 55%, #06b6d4 100%);
  --panel: rgba(255, 255, 255, .97);
  --panel-solid: #ffffff;
  --fg: #1c1533;
  --muted: #5e5873;
  --line: #e2ddf0;
  --soft: #f3f0fb;
  --hint-bg: #fff4d6;
  --hint-fg: #7a4f00;
  --ok: #1d7a42; --ok-bg: #dff3e6; --bad: #b8322b; --bad-bg: #fbe3e1;
  --k-estrella: #c27c00; --k-rocoso: #b45309; --k-gaseoso: #d9480f; --k-helado: #0e7f9b; --k-luna: #6b6589;
  --k-enano: #be2f86; --k-region: #4d7c0f; --k-galaxia: #5b21d6; --k-nebulosa: #c0267a; --k-agujero: #b42318; --k-cumulo: #1f6fd1;
  --shadow: 0 12px 32px rgba(20, 8, 60, .2), 0 2px 6px rgba(20, 8, 60, .1);
  --f-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r: 20px;
  --dock-h: 132px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(24, 16, 52, .96); --panel-solid: #181034; --fg: #f1edfb; --muted: #aaa2c4; --line: #33295a; --soft: #231a48;
    --brand: #8b5cf6; --brand-2: #a78bfa; --hint-bg: #3a2a07; --hint-fg: #ffd77e; --ok: #59d38c; --ok-bg: #0f2f1e; --bad: #ff7a70; --bad-bg: #3a1513;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark;
    --k-estrella: #f5b83d; --k-rocoso: #e7a35a; --k-gaseoso: #ff8a4c; --k-helado: #4fd1ee; --k-luna: #b7b0d6;
    --k-enano: #f075bd; --k-region: #a3d14b; --k-galaxia: #a78bfa; --k-nebulosa: #f472b6; --k-agujero: #ff7a70; --k-cumulo: #6aaaf5;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(24, 16, 52, .96); --panel-solid: #181034; --fg: #f1edfb; --muted: #aaa2c4; --line: #33295a; --soft: #231a48;
  --brand: #8b5cf6; --brand-2: #a78bfa; --hint-bg: #3a2a07; --hint-fg: #ffd77e; --ok: #59d38c; --ok-bg: #0f2f1e; --bad: #ff7a70; --bad-bg: #3a1513;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark;
  --k-estrella: #f5b83d; --k-rocoso: #e7a35a; --k-gaseoso: #ff8a4c; --k-helado: #4fd1ee; --k-luna: #b7b0d6;
  --k-enano: #f075bd; --k-region: #a3d14b; --k-galaxia: #a78bfa; --k-nebulosa: #f472b6; --k-agujero: #ff7a70; --k-cumulo: #6aaaf5;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--space); color: var(--fg); font-family: var(--f-body); font-size: 16px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }

.stage { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 40%, #120a3a 0%, var(--space) 70%); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; background: transparent; color: #fff; padding: 4px 8px 4px 14px; font-size: 13px; font-weight: 700; white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 8px rgba(0, 0, 0, .6); transform: translate(-7px, -50%); will-change: transform; border-radius: 12px; }
.lbl::before { content: ""; position: absolute; left: 3px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--c, #fff); box-shadow: 0 0 6px var(--c, #fff); }
.lbl.small { font-size: 11.5px; font-weight: 400; opacity: .85; }
.lbl.big { font-family: var(--f-display); font-size: 15px; font-weight: 800; letter-spacing: .02em; }
.lbl.here { color: var(--gold); }
.lbl:hover, .lbl.sel { background: rgba(255, 255, 255, .14); }
.lbl.sel { outline: 1.5px solid rgba(255, 255, 255, .55); }
.no-labels .lbl:not(.sel) { visibility: hidden; }

/* ---------- Barra superior (siempre sobre el espacio oscuro) ---------- */
.top { position: fixed; z-index: 35; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to bottom, rgba(13, 6, 48, .85), rgba(13, 6, 48, 0)); pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { background: none; border: 0; padding: 0; display: flex; align-items: center; }
.brand img { height: 34px; width: auto; display: block; }
.crumb { color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 18px; padding-left: 12px; border-left: 1px solid rgba(255, 255, 255, .3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.search { position: relative; flex: 1 1 auto; max-width: 420px; margin-left: auto; }
.search input { width: 100%; height: 46px; border-radius: 23px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(20, 10, 60, .62); color: #fff; padding: 0 18px 0 44px; font: inherit; font-size: 16px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.search input::placeholder { color: rgba(235, 228, 255, .75); }
.search .s-ic { position: absolute; left: 15px; top: 13px; width: 20px; height: 20px; color: #ddd3ff; pointer-events: none; }
.results { position: absolute; top: 54px; left: 0; right: 0; max-height: min(60vh, 480px); overflow: auto; background: var(--panel-solid); color: var(--fg); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; }
.perfil-chip { display: flex; align-items: center; gap: 8px; height: 46px; border-radius: 23px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(20, 10, 60, .62); color: #fff; padding: 0 14px 0 6px; font-weight: 700; white-space: nowrap; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.perfil-chip .lv { width: 34px; height: 34px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; }
.perfil-chip small { display: block; font-weight: 400; font-size: 12px; opacity: .8; line-height: 1.1; }
.perfil-chip span { line-height: 1.15; text-align: left; font-size: 14px; }

.lang-btn { display: flex; height: 46px; border-radius: 23px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(20, 10, 60, .62); padding: 4px; gap: 2px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); flex: none; }
.lang-btn span { display: grid; place-items: center; min-width: 38px; border-radius: 19px; color: #cfc6ee; font-weight: 700; font-size: 13.5px; }
.lang-btn span.on { background: #fff; color: #3b0f99; }
/* ---------- Dock: vistas + pestañas ---------- */
.dock { position: fixed; z-index: 34; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dock > * { pointer-events: auto; }
.vistas { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 100%; padding: 2px; }
.vistas::-webkit-scrollbar { display: none; }
.vista { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, .3); background: rgba(20, 10, 60, .65); color: #fff; font-weight: 700; font-size: 14px; white-space: nowrap; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.vista svg { width: 18px; height: 18px; }
.vista[aria-pressed="true"] { background: #fff; color: #3b0f99; border-color: #fff; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
.tabbar { display: flex; gap: 4px; background: var(--panel); border-radius: 26px; padding: 6px; box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 78px; height: 58px; justify-content: center; border: 0; background: transparent; border-radius: 20px; color: var(--muted); font-weight: 700; font-size: 13px; flex: none; }
.tab svg { width: 24px; height: 24px; }
.tab:hover { background: var(--soft); color: var(--fg); }
.tab[aria-current="true"] { background: var(--grad); color: #fff; box-shadow: 0 4px 14px rgba(219, 39, 119, .35); }
.at-home .dock .vistas, .lesson-on .dock, .game-on .dock { display: none; }

/* ---------- Paneles ---------- */
.panel { position: fixed; z-index: 25; background: var(--panel); color: var(--fg); border-radius: var(--r); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); display: flex; flex-direction: column; overflow: hidden; }
.side { top: calc(76px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: 370px; max-height: calc(100% - 92px - var(--dock-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.sheet { right: max(84px, calc(env(safe-area-inset-right, 0px) + 72px)); top: calc(76px + env(safe-area-inset-top, 0px)); width: 400px; max-height: calc(100% - 92px - var(--dock-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.p-head { display: flex; align-items: flex-start; gap: 8px; padding: 16px 12px 8px 20px; flex: none; }
.p-title { flex: 1; min-width: 0; }
.eyebrow { font-size: 12.5px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--muted); }
.p-title h2 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.15; }
.ib { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--soft); display: grid; place-items: center; flex: none; color: var(--fg); }
.ib svg { width: 18px; height: 18px; }
.p-body { padding: 4px 20px 20px; overflow: auto; overscroll-behavior: contain; min-height: 0; }
.p-body p { line-height: 1.6; margin: 8px 0; max-width: 62ch; }
.hint { color: var(--muted); font-size: 14.5px; }
.list-h { font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; font-weight: 700; }
.list-h:first-child { margin-top: 4px; }
.item-list { display: flex; flex-direction: column; gap: 2px; }
.item { display: flex; align-items: center; gap: 12px; text-align: left; border: 0; background: transparent; border-radius: 12px; padding: 8px 10px; min-height: 52px; width: 100%; }
.item:hover { background: var(--soft); }
.item img, .item .th { width: 38px; height: 38px; border-radius: 50%; flex: none; }
.item .it-t { flex: 1; min-width: 0; }
.item b { display: block; font-size: 15.5px; }
.item small { color: var(--muted); font-size: 13px; }
.item .seen { width: 22px; height: 22px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 700; }
.item .tag { font-size: 12px; font-weight: 700; border-radius: 10px; padding: 3px 8px; background: var(--soft); color: var(--muted); flex: none; }
.big-item { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%; border: 1.5px solid var(--line); background: transparent; border-radius: 16px; padding: 12px; }
.big-item:hover { border-color: var(--brand-2); background: var(--soft); }
.big-item .ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: var(--c, var(--brand)); }
.big-item .ico svg { width: 28px; height: 28px; }
.big-item b { display: block; font-family: var(--f-display); font-size: 17px; }
.big-item small { color: var(--muted); font-size: 13.5px; line-height: 1.4; display: block; }
.big-item .done { color: var(--ok); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: var(--brand); color: #fff; font-weight: 700; transition: transform .12s; }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn.glow { background: var(--grad); box-shadow: 0 6px 20px rgba(219, 39, 119, .4); }
.btn.ghost { background: var(--soft); color: var(--fg); }
.btn.danger { background: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Ficha */
.f-media { position: relative; display: grid; place-items: center; height: 168px; flex: none; background: radial-gradient(circle at 50% 55%, #1d1150 0%, #07041a 75%); overflow: hidden; }
.f-media img { width: 132px; height: 132px; border-radius: 50%; }
.f-media canvas.stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.f-media .ib { position: absolute; top: 12px; right: 12px; background: rgba(255, 255, 255, .16); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; border-radius: 14px; padding: 4px 10px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.f-name { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.1; margin: 8px 0 2px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
.stat { background: var(--soft); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.stat span { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.stat b { display: block; font-size: 15.5px; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sab { background: var(--hint-bg); color: var(--hint-fg); border-radius: 16px; padding: 12px 14px; margin: 12px 0; line-height: 1.55; border-left: 5px solid var(--gold); }
.sab strong { display: block; font-family: var(--f-display); letter-spacing: .03em; font-size: 15px; margin-bottom: 2px; }
.cmp { display: flex; align-items: flex-end; justify-content: center; gap: 22px; padding: 12px; background: var(--soft); border-radius: 16px; margin: 8px 0; overflow: hidden; }
.cmp figure { margin: 0; text-align: center; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cmp i { display: block; border-radius: 50%; }
.f-nav { display: flex; gap: 8px; margin-top: 14px; }
.f-nav .btn { flex: 1; }

/* Controles del mapa */
.mapctl { position: fixed; z-index: 24; right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
.mc { width: 50px; height: 50px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(20, 10, 60, .65); color: #fff; font-size: 24px; font-weight: 700; display: grid; place-items: center; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.mc svg { width: 22px; height: 22px; }
.mc.txt { font-family: var(--f-display); font-size: 15px; }
.mc[aria-pressed="false"] { opacity: .55; }
.at-home .mapctl, .at-home .legend { visibility: hidden; }
.legend { position: fixed; z-index: 23; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(var(--dock-h) + 10px + env(safe-area-inset-bottom, 0px)); color: rgba(235, 228, 255, .85); font-size: 12.5px; max-width: 300px; line-height: 1.4; text-shadow: 0 1px 2px #000; }
.legend b { color: #fff; }
.side:not([hidden]) ~ .legend { visibility: hidden; }

/* Inicio */
.home { position: fixed; inset: 0; z-index: 30; overflow: auto; background: radial-gradient(ellipse at 30% 30%, rgba(13, 6, 48, .55), rgba(4, 2, 15, .88) 70%); color: #fff;
  padding-top: calc(84px + env(safe-area-inset-top, 0px)); padding-bottom: calc(var(--dock-h) - 40px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.home-in { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: start; }
.home h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(42px, 7vw, 76px); line-height: .95; margin: 8px 0 14px; letter-spacing: -.02em; }
.home h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.home .lead { font-size: 18px; line-height: 1.55; color: #e4dcff; max-width: 46ch; margin: 0 0 20px; }
.home .eyebrow { color: #c4b5fd; }
.go-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.go { text-align: left; border: 1px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .07); color: #fff; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.go:hover { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .4); }
.go b { font-family: var(--f-display); font-size: 18px; }
.go small { color: #cfc6ee; font-size: 13.5px; line-height: 1.35; }
.go .gi { font-size: 13px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: .08em; }
.home-card { background: var(--panel); color: var(--fg); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); }
.home-card + .home-card { margin-top: 12px; }
.lvbar { height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
.lvbar i { display: block; height: 100%; background: var(--grad); border-radius: 6px; }
.home .start { margin-top: 18px; height: 54px; font-size: 17px; padding: 0 26px; border-radius: 27px; }

/* Lección */
.lesson { position: fixed; z-index: 26; background: var(--panel); color: var(--fg); border-radius: var(--r); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
  left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100% - 32px)); max-height: calc(100% - 110px); }
.lesson .p-title h2 { font-size: 20px; }
.lesson .l-say { font-size: 15.5px; }
.lesson .l-body { grid-template-columns: 1fr; }
.lesson .l-art svg { width: 72px; height: 72px; }
.lesson.min .l-body, .lesson.min .p-head .eyebrow { display: none; }
.lesson.min .p-title h2 { font-size: 16px; }
.lesson .ib.mini svg { transition: transform .2s; }
.lesson.min .ib.mini svg { transform: rotate(180deg); }
.lesson .l-body { padding: 4px 20px 0; overflow: auto; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start; }
.lesson .l-body p { line-height: 1.6; margin: 6px 0 12px; }
.lesson .l-art svg { width: 96px; height: 96px; display: block; }
.lesson .l-foot { display: flex; align-items: center; gap: 10px; padding: 12px 20px 16px; flex: none; }
.dots { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--brand); width: 22px; border-radius: 4px; }
.mnemo { font-family: var(--f-display); font-weight: 800; font-size: 17px; color: var(--brand); }
.lesson-on .mapctl { top: calc(50% - 60px); }

/* Juegos y modales */

function moonSVG(f) {

  const limb = wax ? 1 : 0, term = wax ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0);
  const lit = f === 0 ? '' : `<path d="M50 10 A40 40 0 0 ${limb} 50 90 A${rx.toFixed(1)} 40 0 0 ${term} 50 10Z" fill="#f4f1e6"/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="#2a2440"/>${lit}<circle cx="50" cy="50" r="40" fill="none" stroke="#8a84a8" stroke-width="1"/></svg>`;
}

Object.assign(LESSONS, {"sol": [{"focus": "sol", "t": "Una estrella muy cerca", "say": "Esta enorme bola brillante es el Sol, la estrella que nos da luz y calor. No es fuego como el de una fogata: es gas tan caliente que brilla, y en su centro ocurre algo increíble llamado fusión nuclear.", "en": {"t": "A star very close to us", "say": "This huge glowing ball is the Sun, the star that gives us light and heat. It is not fire like a campfire: it is gas so hot that it shines, and at its center something amazing happens, called nuclear fusion."}}, {"focus": "sol", "t": "Una fábrica de energía", "say": "En el núcleo del Sol la temperatura llega a quince millones de grados. Ahí, el hidrógeno se une para formar helio y libera muchísima energía. Esa energía tarda miles de años en llegar a la superficie.", "en": {"t": "An energy factory", "say": "In the Sun’s core the temperature reaches fifteen million degrees. There, hydrogen joins together to make helium and releases an enormous amount of energy. That energy takes thousands of years to reach the surface."}}, {"scene": "solar", "cam": [0, 120, 130], "tgt": [0, 0, 0], "t": "El jefe del Sistema Solar", "say": "El Sol tiene casi toda la masa del Sistema Solar: más del noventa y nueve por ciento. Su gravedad mantiene a todos los planetas girando a su alrededor, como si estuvieran atados con un hilo invisible.", "en": {"t": "The boss of the Solar System", "say": "The Sun holds almost all the mass of the Solar System: more than ninety-nine percent. Its gravity keeps every planet circling around it, as if they were tied to it with an invisible string."}}, {"focus": "tierra", "t": "Su luz tarda 8 minutos", "say": "La luz del Sol viaja a trescientos mil kilómetros por segundo y tarda unos ocho minutos en llegar a la Tierra. Así que cuando ves el Sol, lo estás viendo como era hace ocho minutos.", "en": {"t": "Its light takes 8 minutes", "say": "Sunlight travels at three hundred thousand kilometers per second and takes about eight minutes to reach Earth. So when you see the Sun, you are seeing it as it was eight minutes ago."}}, {"focus": "sol", "t": "¡Cuida tus ojos!", "say": "Un consejo muy importante: nunca mires el Sol directamente, ni con binoculares ni con telescopio. Para observarlo usa lentes especiales certificados o proyecta su imagen en una hoja de papel.", "en": {"t": "Protect your eyes!", "say": "A very important tip: never look straight at the Sun, and never through binoculars or a telescope. To observe it, use certified solar glasses or project its image onto a sheet of paper."}}], "lunas": [{"focus": "luna", "t": "Compañeras de los planetas", "say": "Los planetas también tienen compañeras: las lunas. La nuestra es la Luna, el único lugar fuera de la Tierra que han pisado personas. Pero en el Sistema Solar hay cientos de lunas, ¡y algunas son sorprendentes!", "en": {"t": "The planets’ companions", "say": "Planets have companions too: moons. Ours is the Moon, the only place beyond Earth where people have walked. But the Solar System has hundreds of moons, and some of them are amazing!"}}, {"focus": "io", "t": "Ío, la luna de los volcanes", "say": "Esta es Ío, una luna de Júpiter. Es el lugar con más volcanes activos de todo el Sistema Solar. La gravedad de Júpiter la estira y la aprieta, y eso la calienta por dentro.", "en": {"t": "Io, the volcano moon", "say": "This is Io, a moon of Jupiter. It is the place with the most active volcanoes in the whole Solar System. Jupiter’s gravity stretches and squeezes it, and that heats it up inside."}}, {"focus": "europa", "t": "Europa, un océano escondido", "say": "Europa parece una bola de hielo, pero debajo de su corteza hay un océano de agua salada, con más agua que todos los océanos de la Tierra juntos. Es uno de los mejores lugares para buscar vida.", "en": {"t": "Europa, a hidden ocean", "say": "Europa looks like a ball of ice, but under its crust there is an ocean of salty water, with more water than all of Earth’s oceans put together. It is one of the best places to look for life."}}, {"focus": "ganimedes", "t": "Ganímedes, la gigante", "say": "Ganímedes es la luna más grande del Sistema Solar. Es incluso más grande que el planeta Mercurio, y tiene su propio campo magnético, con auroras.", "en": {"t": "Ganymede, the giant", "say": "Ganymede is the largest moon in the Solar System. It is even bigger than the planet Mercury, and it has its own magnetic field, with auroras."}}, {"focus": "titan", "t": "Titán, lluvia de metano", "say": "Titán, la luna más grande de Saturno, tiene una atmósfera gruesa y anaranjada. Allí llueve, y hay ríos y lagos, pero no son de agua: son de metano líquido.", "en": {"t": "Titan, methane rain", "say": "Titan, Saturn’s largest moon, has a thick orange atmosphere. It rains there, and it has rivers and lakes, but they are not made of water: they are liquid methane."}}, {"focus": "encelado", "t": "Encélado, géiseres de hielo", "say": "Esta pequeña luna blanca es Encélado. Desde su polo sur lanza chorros de agua salada al espacio, que salen de un océano escondido bajo el hielo.", "en": {"t": "Enceladus, ice geysers", "say": "This small white moon is Enceladus. From its south pole it shoots jets of salty water into space, coming from an ocean hidden under the ice."}}], "enanos": [{"focus": "cinturon", "t": "El cinturón de asteroides", "say": "Entre Marte y Júpiter hay un enorme anillo de rocas: el cinturón de asteroides. Aunque hay millones de ellas, están tan separadas que las naves lo cruzan sin chocar.", "en": {"t": "The asteroid belt", "say": "Between Mars and Jupiter there is a huge ring of rocks: the asteroid belt. Even though there are millions of them, they are so far apart that spacecraft fly through it without crashing."}}, {"focus": "ceres", "t": "Ceres", "say": "El objeto más grande del cinturón es Ceres. Es tan grande que su propia gravedad lo hizo redondo, por eso es un planeta enano. La sonda Dawn lo visitó y encontró manchas brillantes de sal.", "en": {"t": "Ceres", "say": "The biggest object in the belt is Ceres. It is so big that its own gravity made it round, which is why it is a dwarf planet. The Dawn spacecraft visited it and found bright spots of salt."}}, {"focus": "pluton", "t": "Plutón", "say": "Muy lejos, más allá de Neptuno, está Plutón. Fue considerado el noveno planeta durante setenta y seis años. En dos mil quince, la nave New Horizons descubrió en él una enorme llanura de hielo con forma de corazón.", "en": {"t": "Pluto", "say": "Far away, beyond Neptune, is Pluto. It was called the ninth planet for seventy-six years. In twenty fifteen, the New Horizons spacecraft discovered a huge heart-shaped plain of ice on it."}}, {"focus": "kuiper", "t": "¿Por qué Plutón ya no es planeta?", "say": "Para ser planeta hay que cumplir tres reglas: girar alrededor del Sol, ser redondo y haber limpiado tu órbita de otros objetos. Plutón comparte su camino con miles de cuerpos helados del cinturón de Kuiper, por eso desde dos mil seis es un planeta enano.", "en": {"t": "Why isn’t Pluto a planet anymore?", "say": "To be a planet you must follow three rules: orbit the Sun, be round, and have cleared your orbit of other objects. Pluto shares its path with thousands of icy bodies in the Kuiper belt, so since two thousand six it has been a dwarf planet."}}], "estrellas": [{"scene": "galaxy", "focus": "orion-neb", "t": "Nacen en nubes", "say": "Las estrellas nacen dentro de enormes nubes de gas y polvo llamadas nebulosas. La gravedad junta el gas hasta que se calienta tanto que se enciende. Esta es la Nebulosa de Orión, una guardería de estrellas.", "en": {"t": "Born in clouds", "say": "Stars are born inside huge clouds of gas and dust called nebulae. Gravity pulls the gas together until it gets so hot that it lights up. This is the Orion Nebula, a nursery of stars."}}, {"scene": "galaxy", "focus": "sol", "t": "La edad adulta", "say": "Una vez encendida, la estrella pasa casi toda su vida convirtiendo hidrógeno en helio, como hace nuestro Sol desde hace cuatro mil seiscientos millones de años.", "en": {"t": "Adulthood", "say": "Once it lights up, a star spends almost its whole life turning hydrogen into helium, just like our Sun has been doing for four thousand six hundred million years."}}, {"scene": "galaxy", "focus": "betelgeuse", "t": "Gigantes rojas", "say": "Cuando se le acaba el combustible, la estrella se hincha y se vuelve una gigante roja. Betelgeuse, en la constelación de Orión, es una supergigante roja tan grande que, en el lugar del Sol, llegaría casi hasta Júpiter.", "en": {"t": "Red giants", "say": "When it runs out of fuel, a star swells up and becomes a red giant. Betelgeuse, in the constellation Orion, is a red supergiant so big that, if it took the Sun’s place, it would reach almost to Jupiter."}}, {"scene": "galaxy", "focus": "cangrejo", "t": "Explosiones de supernova", "say": "Las estrellas muy grandes terminan su vida con una explosión gigantesca llamada supernova. La Nebulosa del Cangrejo son los restos de una que vieron astrónomos chinos en el año mil cincuenta y cuatro. ¡Los átomos de tu cuerpo se fabricaron en estrellas como esas!", "en": {"t": "Supernova explosions", "say": "Very big stars end their lives with a giant explosion called a supernova. The Crab Nebula is what is left of one that Chinese astronomers saw in the year ten fifty-four. The atoms in your body were made in stars like these!"}}, {"scene": "galaxy", "focus": "sgra", "t": "Agujeros negros", "say": "Algunas estrellas, al morir, se convierten en agujeros negros, donde la gravedad es tan fuerte que ni la luz escapa. En el centro de nuestra galaxia hay uno gigante: Sagitario A estrella.", "en": {"t": "Black holes", "say": "Some stars, when they die, become black holes, where gravity is so strong that not even light can escape. At the center of our galaxy there is a giant one: Sagittarius A star."}}], "exploracion": [{"focus": "luna", "t": "Primeros pasos", "say": "En mil novecientos sesenta y nueve, la misión Apolo once llevó a las primeras personas a caminar sobre la Luna. Y en dos mil veinticuatro, la UNAM envió Colmena, la primera misión mexicana rumbo a la Luna.", "en": {"t": "First steps", "say": "In nineteen sixty-nine, the Apollo eleven mission took the first people to walk on the Moon. And in twenty twenty-four, Mexico’s national university, UNAM, sent Colmena, the first Mexican mission to the Moon."}}, {"focus": "marte", "t": "Robots en Marte", "say": "Marte es el planeta más visitado por robots. Los róvers Curiosity y Perseverance recorren su suelo buscando pistas de agua y de vida antigua, y el pequeño helicóptero Ingenuity fue el primero en volar en otro planeta.", "en": {"t": "Robots on Mars", "say": "Mars is the planet most visited by robots. The Curiosity and Perseverance rovers drive across its surface looking for clues of water and ancient life, and the little helicopter Ingenuity was the first to fly on another planet."}}, {"focus": "jupiter", "t": "Rumbo a los gigantes", "say": "La nave Juno llegó a Júpiter en dos mil dieciséis para estudiar su interior, y Europa Clipper ya viaja hacia su luna Europa para investigar su océano escondido.", "en": {"t": "Off to the giants", "say": "The Juno spacecraft reached Jupiter in twenty sixteen to study its interior, and Europa Clipper is already on its way to the moon Europa to investigate its hidden ocean."}}, {"focus": "saturno", "t": "Trece años en Saturno", "say": "La misión Cassini pasó trece años estudiando Saturno, sus anillos y sus lunas. Además, dejó caer la sonda Huygens sobre Titán: el aterrizaje más lejano de la historia.", "en": {"t": "Thirteen years at Saturn", "say": "The Cassini mission spent thirteen years studying Saturn, its rings and its moons. It also dropped the Huygens probe onto Titan: the most distant landing in history."}}, {"focus": "pluton", "t": "Hasta el borde", "say": "La nave New Horizons tardó nueve años en llegar a Plutón, y las Voyager, lanzadas en mil novecientos setenta y siete, ya salieron de la burbuja del Sol. Son los objetos humanos más lejanos que existen.", "en": {"t": "To the edge", "say": "The New Horizons spacecraft took nine years to reach Pluto, and the Voyagers, launched in nineteen seventy-seven, have already left the Sun’s bubble. They are the most distant human-made objects there are."}}], "cielo": [{"focus": "venus", "t": "El lucero", "say": "¿Has visto una estrella muy brillante justo al atardecer? Muchas veces no es una estrella: es Venus, el planeta más brillante del cielo. Por eso le llaman el lucero de la tarde o de la mañana.", "en": {"t": "The evening star", "say": "Have you seen a very bright star right at sunset? Often it is not a star at all: it is Venus, the brightest planet in the sky. That is why it is called the evening star, or the morning star."}}, {"focus": "jupiter", "t": "Júpiter y sus lunas", "say": "Júpiter también se ve a simple vista como un punto muy brillante. Si lo miras con unos binoculares bien firmes, podrás ver a su lado hasta cuatro puntitos: sus lunas, igual que las vio Galileo.", "en": {"t": "Jupiter and its moons", "say": "Jupiter is also easy to see as a very bright dot. If you hold binoculars very steady, you can see up to four tiny dots next to it: its moons, just as Galileo saw them."}}, {"scene": "galaxy", "focus": "orion-neb", "t": "Orión en invierno", "say": "En las noches de invierno busca a Orión. Sus tres estrellas en fila son las Tres Marías. Debajo hay una manchita borrosa: la Nebulosa de Orión. Y en su hombro brilla la naranja Betelgeuse.", "en": {"t": "Orion in winter", "say": "On winter nights, look for Orion. Its three stars in a row form Orion’s Belt. Below them there is a fuzzy patch: the Orion Nebula. And on its shoulder shines orange Betelgeuse."}}, {"scene": "galaxy", "focus": "pleyades", "t": "Las Pléyades", "say": "Cerca de Orión hay un grupito de estrellas azuladas: las Pléyades, también llamadas las Siete Cabrillas. Los mexicas las observaban para celebrar la ceremonia del Fuego Nuevo cada cincuenta y dos años.", "en": {"t": "The Pleiades", "say": "Near Orion there is a little group of bluish stars: the Pleiades, also called the Seven Sisters. The Mexica people watched them to hold the New Fire ceremony every fifty-two years."}}, {"scene": "galaxy", "focus": "polaris", "t": "Encuentra el norte", "say": "Para encontrar el norte de noche, busca la Estrella Polar. Casi no se mueve en el cielo. En la Ciudad de México aparece a unos diecinueve grados sobre el horizonte.", "en": {"t": "Find north", "say": "To find north at night, look for the North Star. It barely moves in the sky. From Mexico City it appears about nineteen degrees above the horizon."}}, {"scene": "galaxy", "cam": [0, 62, 70], "tgt": [0, 0, 0], "t": "La Vía Láctea en verano", "say": "Y en las noches oscuras de verano, lejos de las luces de la ciudad, verás una franja blanca cruzando el cielo: es nuestra galaxia, la Vía Láctea. ¡Apaga las luces y mira hacia arriba!", "en": {"t": "The Milky Way in summer", "say": "And on dark summer nights, far from city lights, you will see a white band across the sky: our galaxy, the Milky Way. Turn off the lights and look up!"}}]});
const LESSON_META_EN = {"orden": {"t": "The order of the planets", "d": "We travel from the Sun to Neptune, planet by planet, and learn a trick so you never forget the order.", "lvl": "Elementary"}, "tipos": {"t": "Rocky, giant and icy", "d": "Find out why the planets near the Sun are made of rock and the far ones are huge balls of gas and ice.", "lvl": "Elementary · Middle school"}, "fases": {"t": "The phases of the Moon", "d": "Why the Moon seems to change shape every night, and where the idea of a “month” comes from.", "lvl": "Elementary"}, "estaciones": {"t": "Why are there seasons?", "d": "The secret is the tilt of Earth’s axis. And we bust a very common myth.", "lvl": "Elementary · Middle school"}, "escalas": {"t": "From the Solar System to the universe", "d": "A journey through scales: from our planet to the Milky Way, Andromeda and the observable universe.", "lvl": "Middle school"}, "sol": {"t": "The Sun, our star", "d": "What the Sun is, how it makes its energy, why it rules the Solar System and how to watch it safely.", "lvl": "Elementary · Middle school"}, "lunas": {"t": "The most amazing moons", "d": "Volcanoes on Io, a hidden ocean on Europa, methane rain on Titan and geysers on Enceladus.", "lvl": "Elementary · Middle school"}, "enanos": {"t": "Dwarf planets and belts", "d": "The asteroid belt, Ceres, Pluto and why Pluto stopped being a planet in 2006.", "lvl": "Elementary · Middle school"}, "estrellas": {"t": "The life and death of stars", "d": "From the nebulae where they are born to the supernovae and black holes where they end.", "lvl": "Middle school"}, "exploracion": {"t": "Space exploration", "d": "From Apollo 11 and Mexico’s Colmena mission to the Mars rovers, Cassini and the Voyagers.", "lvl": "Elementary · Middle school"}, "cielo": {"t": "Stargazing from Mexico", "d": "How to find Venus, Jupiter, Orion, the Pleiades, the North Star and the Milky Way with your own eyes.", "lvl": "Elementary · Middle school"}};
const LESSON_STEPS_EN = {"orden": [["Eight planets in a row", "Hello! Welcome to the Solar System. All the planets travel around the Sun, each on its own path, called an orbit. Today we are going to visit them in order, from the closest to the farthest. And so you never forget them, learn this sentence: My Very Educated Mother Just Served Us Nachos."], ["1. Mercury", "First comes Mercury, the smallest planet and the closest to the Sun. It is so fast that it goes all the way around the Sun in just eighty-eight days. Since it has almost no atmosphere, it gets very hot during the day and freezes at night."], ["2. Venus", "Now we reach Venus. It is almost the same size as Earth, but it is covered by thick clouds that trap heat, like a giant greenhouse. That is why it is the hottest planet, even though it is not the closest to the Sun."], ["3. Earth", "The third planet is our home, Earth. It is about one hundred fifty million kilometers from the Sun. Astronomers call that distance one astronomical unit, and they use it like a ruler to measure the Solar System."], ["4. Mars", "Next is Mars, the red planet. Its color comes from iron oxide, the same rust you see on an old nail. After Mars comes the asteroid belt, the border between the rocky planets and the giants."], ["5. Jupiter", "This giant is Jupiter, the biggest planet of all. More than one thousand three hundred Earths would fit inside it. Look at its bands of clouds and its Great Red Spot: it is a storm bigger than our planet."], ["6. Saturn", "Here is Saturn, famous for its rings. They are made of billions of pieces of ice and rock, some as small as grains of sand and others as big as a house."], ["7. Uranus", "The seventh planet is Uranus, a blue-green ice giant. It has something very curious about it: it spins lying on its side, like a ball rolling along its orbit."], ["8. Neptune", "And we reach the end: Neptune, the farthest planet. Out here, sunlight takes about four hours to arrive. Do you remember the sentence? My Very Educated Mother Just Served Us Nachos: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune."]], "tipos": [["The rocky planets", "The four planets closest to the Sun, Mercury, Venus, Earth and Mars, are small and made of rock and metal. When they formed, it was so hot here that ice and gases could not come together."], ["The border: the asteroid belt", "Between Mars and Jupiter there are millions of rocks going around the Sun. This is the asteroid belt. Jupiter’s huge gravity did not let those rocks join together to form a planet."], ["Gas giants", "Farther out are the gas giants, Jupiter and Saturn. They are huge balls of hydrogen and helium, the same gases the Sun is made of. They have no ground to stand on: if you went down, the gas would just get thicker and thicker."], ["Ice giants", "Uranus and Neptune are the ice giants. They contain lots of water, ammonia and methane. Methane is what gives them their beautiful blue color."], ["Beyond: the kingdom of ice", "And past Neptune begins the Kuiper belt, a frozen kingdom where Pluto lives along with thousands of icy bodies. It is like the freezer of the Solar System."]], "fases": [["The Moon does not shine on its own", "The Moon has no light of its own: it reflects sunlight. Half of it is always lit, but from Earth we see that half from different angles. That is why it seems to change shape."], ["New Moon", "When the Moon passes between Earth and the Sun, its lit side faces the Sun and we see the dark side. This is the new Moon, and you can hardly see it."], ["Crescent and first quarter", "Each night we see a little more of its lit side. First a thin crescent appears, and a week later we see half a Moon: the first quarter."], ["Full Moon", "About fifteen days after the new Moon, Earth is between the Sun and the Moon. Then we see its whole face lit up. This is the full Moon."], ["Waning and new again", "After that, the lit part gets smaller every night, until we are back to a new Moon. The whole cycle takes twenty-nine and a half days. That is where the idea of a month comes from."]], "estaciones": [["A tilted planet", "Do you see that yellow line? It is Earth’s axis, and it is tilted twenty-three and a half degrees. That tilt always points to the same place in space, near the North Star."], ["Summer: more direct rays", "When your half of the planet leans toward the Sun, the sunlight arrives more directly and the days are longer. It gets warmer: it is summer."], ["Winter: slanted rays", "Half a year later, your half leans away from the Sun. The rays arrive at a slant, they heat less and the days are short. It is winter."], ["A very common myth", "Many people think the seasons happen because Earth gets closer to or farther from the Sun. But that is not true. In fact, Earth is closest to the Sun in early January, in the middle of winter in the northern hemisphere!"]], "escalas": [["Scale 1: our planet", "Let’s start at home. Earth is almost thirteen thousand kilometers wide. A plane flying nonstop would take about two days to go all the way around it."], ["Scale 2: the Solar System", "Now let’s zoom out. Light is the fastest thing there is, and even so it takes eight minutes to travel from the Sun to Earth, and about four hours to reach Neptune."], ["Scale 3: the stellar neighborhood", "The closest star to us is Proxima Centauri. It is so far away that its light takes more than four years to reach us. That is why astronomers measure these distances in light years: the distance light travels in one year."], ["Scale 4: the Milky Way", "This swirl of light is our galaxy, the Milky Way. The Sun is just one of hundreds of billions of stars, and we are twenty-six thousand light years from the center, where a giant black hole lives."], ["Scale 5: neighboring galaxies", "This is Andromeda, the nearest large galaxy. It is two and a half million light years away. The light you see today left it when the first humans were just appearing on Earth."], ["Scale 6: the observable universe", "And all of this is just our neighborhood. The universe we can observe has hundreds of billions of galaxies. Looking far away means looking into the past. Thanks for traveling with me!"]]};
LESSON_META.forEach(m => { m.en = LESSON_META_EN[m.id]; });
Object.entries(LESSON_STEPS_EN).forEach(([id, a]) => a.forEach(([t, say], i) => { LESSONS[id][i].en = { t, say }; }));

const vwRay = new THREE.Raycaster(); let vwDown = null;
function vwPick(e) {
  if (!VW.cut || !VW.info.body || !VW.info.body.parts.layers) return;
  const r = VW.canvas.getBoundingClientRect(); vwRay.setFromCamera({ x: (e.clientX - r.left) / r.width * 2 - 1, y: -(e.clientY - r.top) / r.height * 2 + 1 }, VW.camera);

  const hits = vwRay.intersectObjects([...lay.children, body], false).filter(h => !(h.point.x > .001 && h.point.z > .001));
  if (!hits.length) return hideLayer();
  const h = hits[0], k = h.object === body ? lay.children.length - 1 : lay.children.indexOf(h.object);

  const d = h.point.length() / VW.info.R, capas = ED[VW.o.id].capas;
  let idx = capas.findIndex(c => d <= c[1] + .002); if (idx < 0) idx = k;
  showLayer(idx);
